      <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
        <h2 className="text-sm font-semibold text-slate-700">{editingId ? "계정 정보 수정" : "새 계정 생성"}</h2>
        <div className="grid sm:grid-cols-2 gap-3">
          <div><label className="text-xs text-slate-500">이름</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">반 또는 직급</label><input value={form.classOrTitle} onChange={e => setForm({ ...form, classOrTitle: e.target.value })} placeholder="예) 4반 또는 부원장" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">전화번호 아이디</label><input value={form.username} disabled={!!editingId} onChange={e => setForm({ ...form, username: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 disabled:bg-slate-50 disabled:text-slate-400" /></div>
          <div>
            <label className="text-xs text-slate-500">권한</label>
            <select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">
              <option value="teacher">교사</option>
              <option value="admin">관리자</option>
            </select>
          </div>
          <div className="sm:col-span-2">
            <label className="text-xs text-slate-500">연결할 수업 반 (수업 기록 담당 교사와 연동 · 상담실장 등은 선택하지 않음)</label>
            <select value={form.linkedTeacherName} onChange={e => setForm({ ...form, linkedTeacherName: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">
              <option value="">연결 안 함</option>
              {teachers.map(t => <option key={t.id} value={t.name}>{t.name} ({t.className})</option>)}
            </select>
          </div>
        </div>
        {!editingId && <p className="text-[11px] text-slate-400">초기 비밀번호는 1234로 자동 설정됩니다.</p>}
        <div className="flex justify-end gap-2">
          {editingId && <button onClick={cancel} className="px-4 py-2 text-sm rounded-lg text-slate-500 hover:bg-slate-50">취소</button>}
          <button onClick={submit} disabled={!form.name || !form.username || !form.classOrTitle} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800 disabled:opacity-40">
            {editingId ? <><Save className="w-4 h-4" /> 수정 저장</> : <><Plus className="w-4 h-4" /> 계정 생성</>}
          </button>
        </div>
      </div>

      <div className="space-y-2">
        {accounts.map(a => (
          <div key={a.id} className="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between flex-wrap gap-2">
            <div>
              <div className="text-sm font-semibold text-slate-800 flex items-center gap-2 flex-wrap">
                {a.name} <span className="text-slate-400 font-normal">· {a.classOrTitle}</span>
                {a.isSuperAdmin && <Badge color="navy">최고 관리자</Badge>}
                <Badge color={a.role === "admin" ? "blue" : "slate"}>{a.role === "admin" ? "관리자" : "교사"}</Badge>
              </div>
              <div className="text-xs text-slate-400 mt-0.5">아이디 {a.username}{a.linkedTeacherName ? ` · ${a.linkedTeacherName} 반 연동` : ""}{a.lastLogin ? ` · 최근 로그인 ${formatDate(a.lastLogin)}` : ""}</div>
            </div>
            <div className="flex gap-1.5">
              {!a.isSuperAdmin && <button onClick={() => startEdit(a)} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>}
              <button onClick={() => { if (confirm(`${a.name} 계정의 비밀번호를 1234로 초기화할까요?`)) onResetPassword(a.id); }} className="text-[11px] text-slate-400 border border-slate-200 rounded-md px-2 py-1.5 hover:bg-slate-50">비밀번호 초기화</button>
            </div>
          </div>
        ))}
        {accounts.length === 0 && <p className="text-sm text-slate-400 text-center py-10">등록된 계정이 없습니다.</p>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   기존 모달형 일일 브리핑 작성 (아이 상세 페이지용, 자유 입력)
--------------------------------------------------------- */
function DailyBriefingForm({ child, editing, onCancel, onSave }) {
  const draftKey = `draft:${child.id}:${editing ? editing.id : "adhoc"}`;
  const [form, setForm] = useState(editing || { date: todayISO(), topic: "", teacherSummary: "", antecedent: "", behavior: "", consequence: "" });
  const [savedNote, setSavedNote] = useState("");
  const timer = useRef(null);

  useEffect(() => {
    (async () => {
      if (!editing) { const d = await loadKey(draftKey, null, false); if (d) { setForm(d); setSavedNote("임시저장된 내용을 불러왔습니다."); } }
    })();
    // eslint-disable-next-line
  }, []);

  const set = (k, v) => {
    const next = { ...form, [k]: v }; setForm(next); clearTimeout(timer.current);
    timer.current = setTimeout(async () => { await saveKey(draftKey, next, false); setSavedNote("자동 임시저장됨 · " + new Date().toLocaleTimeString("ko-KR")); }, 900);
  };
  const submit = async () => { await deleteKey(draftKey, false); onSave({ ...form, week: weekLabel(form.date), status: "completed" }); };

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-40 p-4">
      <div className="bg-white rounded-xl w-full max-w-2xl p-6 space-y-4 max-h-[92vh] overflow-y-auto">
        <div className="flex items-center justify-between">
          <div><h3 className="font-bold text-slate-800">{editing ? "일일 브리핑 수정" : "일일 브리핑 작성"}</h3><p className="text-xs text-slate-400 mt-0.5">{child.name} 학생 · {form.date} · {weekLabel(form.date)}</p></div>
          <button onClick={onCancel}><X className="w-5 h-5 text-slate-400" /></button>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs text-slate-500">수업일</label><input type="date" value={form.date} onChange={e => set("date", e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">수업 주차</label><input value={weekLabel(form.date)} disabled className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 bg-slate-50 text-slate-400" /></div>
        </div>
        <div><label className="text-xs text-slate-500">수업 주제</label><input value={form.topic} onChange={e => set("topic", e.target.value)} placeholder="예) 찰흙으로 동물 만들기" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        <div><label className="text-xs text-slate-500 font-medium">교사 종합 브리핑</label><AutoTextarea value={form.teacherSummary} onChange={e => set("teacherSummary", e.target.value)} /></div>
        {[
          ["antecedent", "선행사건 (그 행동 직전에 무엇이 있었는가?)", "예) 어려운 작업을 제시함 / 교사가 다른 아이를 칭찬함 / 친구가 재료를 가져감 / 수업 종료시간을 안내함"],
          ["behavior", "행동 (정확히 무엇이 있었는가)", "예) 재료를 바닥에 던졌다 / 책상을 크게 내려쳤다 — 누가 보더라도 비슷하게 판단할 수 있는 행동으로 객관적으로 기록"],
          ["consequence", "결과 (그 행동 직후 무엇이 일어났는가)", "예) 과제가 중단됨 / 선생님이 아이 옆으로 감 / 친구들이 아이를 바라봄 / 원하는 재료를 받음 / 별도 공간으로 이동"],
        ].map(([k, label, ph]) => (
          <div key={k}>
            <label className="text-xs text-slate-500 font-medium">{label}</label>
            <AutoTextarea value={form[k]} onChange={e => set(k, e.target.value)} placeholder={ph} />
          </div>
        ))}
        <div className="flex items-center justify-between pt-1">
          <span className="text-[11px] text-slate-400 flex items-center gap-1">{savedNote && <><Save className="w-3 h-3" />{savedNote}</>}</span>
          <div className="flex gap-2">
            <button onClick={onCancel} className="px-4 py-2 text-sm rounded-lg text-slate-500 hover:bg-slate-50">취소</button>
            <button onClick={submit} disabled={!form.topic} className="px-4 py-2 text-sm rounded-lg bg-blue-900 text-white font-medium hover:bg-blue-800 disabled:opacity-40">저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   아이 상세 페이지
--------------------------------------------------------- */
function ChildDetail({ child, schedule, teachers, briefings, deepBriefings, role, generating, onUpdateChild, onWithdrawChild, onReinstateChild, onAddBriefing, onUpdateBriefing, onDeleteBriefing, onGenerateDeep, setView, setSelectedDeepId }) {
  const [tab, setTab] = useState("timeline");
  const [showForm, setShowForm] = useState(false);
  const [editingBriefing, setEditingBriefing] = useState(null);
  const [editingInfo, setEditingInfo] = useState(false);
  const isWithdrawn = child.status === "withdrawn";

  const myBriefings = briefings.filter(b => b.childId === child.id && b.status === "completed").sort((a, b) => new Date(b.date) - new Date(a.date));
  const myDeep = deepBriefings.filter(d => d.childId === child.id).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const used = myDeep.length * 4;
  const pending = myBriefings.length - used;
  const st = statusOf(child, briefings, deepBriefings);
  const mySlotIds = schedule.filter(s => s.childIds.includes(child.id)).map(s => s.id);

  const timeline = [
    ...myBriefings.map(b => ({ type: "daily", date: b.date, data: b })),
    ...myDeep.map(d => {
      const srcDates = myBriefings.filter(b => d.sourceBriefingIds.includes(b.id)).map(b => b.date).sort();
      return { type: "deep", date: srcDates.length ? srcDates[srcDates.length - 1] : d.createdAt.slice(0, 10), data: d };
    }),
  ].sort((a, b) => {
    if (a.date !== b.date) return new Date(a.date) - new Date(b.date);
    if (a.type === b.type) return 0;
    return a.type === "daily" ? -1 : 1;
  });

  return (
    <div className="space-y-5">
      <button onClick={() => setView("children")} className="flex items-center gap-1 text-sm text-slate-500 hover:text-blue-900"><ChevronLeft className="w-4 h-4" /> 아이 관리로</button>
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <div className="flex items-start justify-between">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-full bg-blue-900 text-white flex items-center justify-center font-bold text-lg">{child.name[0]}</div>
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="text-xl font-bold text-slate-800">{child.name}</h1>
                {isWithdrawn ? <Badge color="red">퇴원 · {child.withdrawnAt ? formatDate(child.withdrawnAt) : ""}</Badge> : <Badge color={st.color}>{st.label}</Badge>}
              </div>
              <div className="text-xs text-slate-400 mt-0.5">{child.age}세 · {child.grade} · 담당 {child.teacher} 선생님 · {child.className}</div>
            </div>
          </div>
          <div className="flex gap-2">
            {isWithdrawn ? (
              <button onClick={() => onReinstateChild(child.id)} className="text-xs font-medium text-blue-900 border border-blue-200 rounded-lg px-3 py-1.5 hover:bg-blue-50">복귀 처리</button>
            ) : (
              <>
                <button onClick={() => setEditingInfo(true)} className="p-2 rounded-lg hover:bg-slate-50 text-slate-400"><Edit2 className="w-4 h-4" /></button>
                <button onClick={() => { if (confirm(`${child.name} 학생을 퇴원 처리할까요? 기존 기록은 보존되며 수업 명단에서만 제외됩니다.`)) onWithdrawChild(child.id); }} className="p-2 rounded-lg hover:bg-red-50 text-red-400" title="퇴원 처리"><UserX className="w-4 h-4" /></button>
              </>
            )}
          </div>
        </div>
        <div className="grid sm:grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
          <div><div className="text-xs font-medium text-slate-500 mb-1">학부모의 주요 교육 니즈</div><p className="text-sm text-slate-700">{child.parentNeeds || "—"}</p></div>
          <div><div className="text-xs font-medium text-slate-500 mb-1">수업 시 참고사항</div><p className="text-sm text-slate-700">{child.classNotes || "—"}</p></div>
        </div>
      </div>

      {pending >= 4 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center justify-between flex-wrap gap-3">
          <p className="text-sm text-amber-800 flex items-center gap-2"><Sparkles className="w-4 h-4" /> {child.name} 학생의 일일 브리핑이 {pending}회 누적되었습니다. 심화브리핑 생성 가능 · 4회 누적 완료</p>
          <button disabled={generating} onClick={onGenerateDeep} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800 disabled:opacity-50">
            {generating ? <Loader2 className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4" />} 심화브리핑 자동 생성
          </button>
        </div>
      )}

      <div className="flex gap-1 border-b border-slate-200">
        {[["timeline", "타임라인"], ["overview", "일일 브리핑"], ["deep", "심화브리핑"]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} className={`px-4 py-2.5 text-sm font-medium border-b-2 -mb-px ${tab === k ? "border-blue-900 text-blue-900" : "border-transparent text-slate-400"}`}>{label}</button>
        ))}
      </div>

      {tab === "timeline" && (
        <div className="space-y-3">
          {timeline.length === 0 && <p className="text-sm text-slate-400 text-center py-10">아직 기록이 없습니다.</p>}
          {timeline.length > 0 && (
            <div className="relative pl-6">
              <div className="absolute left-[7px] top-2 bottom-2 w-px bg-slate-200" />
              <div className="space-y-3">
                {timeline.map(item => item.type === "daily" ? (
                  <div key={`d-${item.data.id}`} className="relative">
                    <div className="absolute -left-[22px] top-2 w-2.5 h-2.5 rounded-full bg-white border-2 border-blue-900" />
                    <div className="bg-white rounded-xl border border-slate-200 p-3.5">
                      <div className="text-xs font-semibold text-slate-800">{formatDate(item.data.date)} · {item.data.week}{item.data.slotLabel ? ` · ${item.data.slotLabel}` : ""}</div>
                      <div className="text-sm text-slate-600 mt-0.5">{item.data.topic}</div>
                    </div>
                  </div>
                ) : (
                  <button key={`g-${item.data.id}`} onClick={() => { setSelectedDeepId(item.data.id); setView("deepReview"); }} className="relative w-full text-left">
                    <div className="absolute -left-[24px] top-2 w-3.5 h-3.5 rounded-full bg-amber-400 border-2 border-white ring-2 ring-amber-400" />
                    <div className="bg-amber-50 rounded-xl border border-amber-200 p-3.5 flex items-center justify-between hover:border-amber-400 transition-colors">
                      <div>
                        <div className="text-xs font-semibold text-amber-800 flex items-center gap-1"><Sparkles className="w-3.5 h-3.5" /> 심화브리핑 생성됨</div>
                        <div className="text-[11px] text-amber-600 mt-0.5">{formatDate(item.data.createdAt)} 생성 · {item.data.status === "final" ? "최종 확정" : item.data.status === "reviewing" ? "검토 중" : "초안"}</div>
                      </div>
                      <ChevronRight className="w-4 h-4 text-amber-400 shrink-0" />
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {tab === "overview" && (
        <div className="space-y-3">
          {!isWithdrawn && (
            <div className="flex justify-end">
              <button onClick={() => { setEditingBriefing(null); setShowForm(true); }} className="flex items-center gap-1.5 bg-amber-400 text-blue-900 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-amber-300"><Plus className="w-4 h-4" /> 일일 브리핑 작성</button>
            </div>
          )}
          {myBriefings.length === 0 && <p className="text-sm text-slate-400 text-center py-10">아직 작성된 일일 브리핑이 없습니다.</p>}
          {myBriefings.map(b => (
            <div key={b.id} className="bg-white rounded-xl border border-slate-200 p-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-semibold text-slate-800">{formatDate(b.date)} · {b.week}{b.slotLabel ? ` · ${b.slotLabel}` : ""} · {b.topic}</div>
                <div className="flex gap-1">
                  <button onClick={() => { setEditingBriefing(b); setShowForm(true); }} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>
                  <button onClick={() => { if (confirm("이 기록을 삭제할까요?")) onDeleteBriefing(b.id); }} className="p-1.5 rounded-md hover:bg-red-50 text-red-400"><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
              </div>
              <div className="grid sm:grid-cols-2 gap-2 text-xs text-slate-600">
                <div className="sm:col-span-2"><span className="font-medium text-slate-400">종합 </span>{b.teacherSummary}</div>
                <div><span className="font-medium text-slate-400">선행사건 </span>{b.antecedent}</div>
                <div><span className="font-medium text-slate-400">행동 </span>{b.behavior}</div>
                <div><span className="font-medium text-slate-400">결과 </span>{b.consequence}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "deep" && (
        <div className="space-y-3">
          {myDeep.length === 0 && <p className="text-sm text-slate-400 text-center py-10">아직 생성된 심화브리핑이 없습니다.</p>}
          {myDeep.map((d, idx) => (
            <button key={d.id} onClick={() => { setSelectedDeepId(d.id); setView("deepReview"); }} className="w-full text-left bg-white rounded-xl border border-slate-200 p-4 hover:border-blue-900 flex items-center justify-between">
              <div><div className="text-sm font-semibold text-slate-800">{myDeep.length - idx}차 심화브리핑</div><div className="text-xs text-slate-400 mt-0.5">생성일 {formatDate(d.createdAt)}</div></div>
              <div className="flex items-center gap-2">
                <Badge color={d.status === "final" ? "green" : d.status === "reviewing" ? "purple" : "blue"}>{d.status === "final" ? "최종 확정" : d.status === "reviewing" ? "검토 중" : "초안 생성"}</Badge>
                <ChevronRight className="w-4 h-4 text-slate-300" />
              </div>
            </button>
          ))}
        </div>
      )}

      {showForm && (
        <DailyBriefingForm child={child} editing={editingBriefing} onCancel={() => setShowForm(false)}
          onSave={(data) => { if (editingBriefing) onUpdateBriefing({ ...editingBriefing, ...data }); else onAddBriefing({ id: uid(), childId: child.id, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), ...data }); setShowForm(false); }} />
      )}
      {editingInfo && (
        <ChildForm initial={child} schedule={schedule} teachers={teachers} initialSlotIds={mySlotIds} onCancel={() => setEditingInfo(false)}
          onSave={(form, slotIds) => { onUpdateChild({ ...child, ...form }, slotIds); setEditingInfo(false); }} />
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   심화브리핑 검토/수정 페이지
--------------------------------------------------------- */
/* ---------------------------------------------------------
   집중브리핑 모아보기 - 학생별로 흩어져 있던 집중브리핑을 한 화면에서 검색/열람
--------------------------------------------------------- */
function DeepBriefingList({ deepBriefings, children, teachers, role, teacherName, setSelectedChildId, setSelectedDeepId, setView }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [classFilter, setClassFilter] = useState("all");

  const classNameByTeacher = Object.fromEntries(teachers.map(t => [t.name, t.className]));
  const childById = Object.fromEntries(children.map(c => [c.id, c]));
  const classNames = Array.from(new Set(teachers.map(t => t.className).filter(Boolean))).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));

  const visibleScope = deepBriefings;

  const rows = visibleScope
    .map(d => ({ deep: d, child: childById[d.childId] }))
    .filter(r => r.child)
    .filter(r => statusFilter === "all" || r.deep.status === statusFilter)
    .filter(r => classFilter === "all" || classNameByTeacher[r.child.teacher] === classFilter)
    .filter(r => !search.trim() || r.child.name.includes(search.trim()))
    .sort((a, b) => new Date(b.deep.updatedAt || b.deep.createdAt) - new Date(a.deep.updatedAt || a.deep.createdAt));

  const statusLabel = (s) => s === "final" ? "최종 확정" : s === "reviewing" ? "검토 중" : "초안";
  const statusColor = (s) => s === "final" ? "green" : s === "reviewing" ? "purple" : "blue";

  const openDeep = (d) => { setSelectedDeepId(d.id); setView("deepReview"); };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><FolderOpen className="w-6 h-6 text-amber-500" /> 집중브리핑 모아보기</h1>
        <p className="text-sm text-slate-500 mt-1">지금까지 작성된 집중브리핑을 한눈에 확인하고 다시 열어 수정할 수 있습니다.</p>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-4 flex flex-wrap gap-2 items-center">
        <div className="relative flex-1 min-w-[160px]">
          <Search className="w-3.5 h-3.5 text-slate-300 absolute left-2.5 top-1/2 -translate-y-1/2" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="학생 이름으로 검색" className="w-full border border-slate-200 rounded-lg pl-8 pr-3 py-2 text-sm" />
        </div>
        <select value={classFilter} onChange={e => setClassFilter(e.target.value)} className="border border-slate-200 rounded-lg px-2.5 py-2 text-sm">
          <option value="all">전체 반</option>
          {classNames.map(cn => <option key={cn} value={cn}>{cn}</option>)}
        </select>
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="border border-slate-200 rounded-lg px-2.5 py-2 text-sm">
          <option value="all">전체 상태</option>
          <option value="draft">초안</option>
          <option value="reviewing">검토 중</option>
          <option value="final">최종 확정</option>
        </select>
      </div>

      {rows.length === 0 ? (
        <div className="bg-white rounded-xl border border-slate-200 border-dashed p-10 text-center text-sm text-slate-400">
          조건에 맞는 집중브리핑이 없습니다.
        </div>
      ) : (
        <div className="space-y-2">
          {rows.map(({ deep, child }) => (
            <button key={deep.id} onClick={() => openDeep(deep)} className="w-full text-left bg-white rounded-xl border border-slate-200 p-4 hover:border-blue-900 flex items-center justify-between gap-3 flex-wrap">
              <div className="min-w-0">
                <div className="text-sm font-semibold text-slate-800 flex items-center gap-2 flex-wrap">
                  {child.name}
                  <span className="text-slate-400 font-normal text-xs">· {child.teacher} 선생님{classNameByTeacher[child.teacher] ? ` (${classNameByTeacher[child.teacher]})` : ""}</span>
                </div>
                <div className="text-xs text-slate-400 mt-1">최근 수정 {formatDate((deep.updatedAt || deep.createdAt || "").slice(0, 10))} · 참고 기록 {deep.sourceBriefingIds?.length || 0}건</div>
              </div>
              <Badge color={statusColor(deep.status)}>{statusLabel(deep.status)}</Badge>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function DeepBriefingReview({ deep, child, allDeepForChild, references, sourceBriefings, role, testMode, onUpdate, setView, returnView, setSelectedDeepId, notify }) {
  const [local, setLocal] = useState(deep.sections);
  const [regenSection, setRegenSection] = useState(null);
  const [regenAll, setRegenAll] = useState(false);
  // 항목별로 "이렇게 고쳐줘"라고 입력하는 수정 방향 지시문
  const [instructions, setInstructions] = useState({});
  // AI가 다시 쓴 결과를 바로 반영하지 않고, 먼저 보여준 뒤 교사가 확인하고 적용하게 합니다.
  const [pendingRegen, setPendingRegen] = useState(null); // { key, label, text }

  useEffect(() => { setLocal(deep.sections); setPendingRegen(null); }, [deep.id]);
  const relevantRefs = references;
  const setInstruction = (key, v) => setInstructions(prev => ({ ...prev, [key]: v }));

  const regenerateAll = async () => {
    setRegenAll(true);
    try {
      let sections;
      if (testMode) sections = mockGenerate(child, sourceBriefings);
      else sections = await generateIntensiveBriefing(child, sourceBriefings, relevantRefs);
      setLocal(sections);
      onUpdate({ ...deep, sections, status: "reviewing", updatedAt: new Date().toISOString() });
      notify("전체 항목을 다시 생성했습니다.");
    } catch (e) { console.error("집중브리핑 생성 실패:", e); notify("집중브리핑 생성에 실패했습니다. 잠시 후 다시 시도해주세요.", "error"); }
    setRegenAll(false);
  };

  const regenerateOne = async (key, label) => {
    setRegenSection(key);
    setPendingRegen(null);
    try {
      let text;
      const instruction = (instructions[key] || "").trim();
      if (testMode) { text = mockGenerate(child, sourceBriefings)[key]; }
      else { text = await regenerateBriefingSection(child, sourceBriefings, key, local, instruction || undefined, relevantRefs); }
      // 바로 덮어쓰지 않고 미리보기로 먼저 보여줍니다. 적용을 눌러야 실제 내용이 바뀝니다.
      setPendingRegen({ key, label, text });
    } catch (e) { console.error("항목 재생성 실패:", e); notify("항목 재생성에 실패했습니다. 잠시 후 다시 시도해주세요.", "error"); }
    setRegenSection(null);
  };

  const applyPendingRegen = () => {
    if (!pendingRegen) return;
    const next = { ...local, [pendingRegen.key]: pendingRegen.text };
    setLocal(next);
    onUpdate({ ...deep, sections: next, status: "reviewing", updatedAt: new Date().toISOString() });
    notify(`'${pendingRegen.label}' 항목에 수정 결과를 적용했습니다.`);
    setPendingRegen(null);
  };
  const discardPendingRegen = () => setPendingRegen(null);

  const saveDraft = () => { onUpdate({ ...deep, sections: local, status: deep.status === "final" ? "final" : "reviewing", updatedAt: new Date().toISOString() }); notify("초안을 저장했습니다."); };
  const finalize = () => { onUpdate({ ...deep, sections: local, status: "final", updatedAt: new Date().toISOString(), finalizedAt: new Date().toISOString() }); notify("심화브리핑을 최종 확정했습니다."); };
  const copyAll = async () => {
    const text = SECTION_DEFS.map(s => `[${s.label}]\n${local[s.key] || ""}`).join("\n\n");
    try { await navigator.clipboard.writeText(`${child.name} 학생 심화브리핑\n\n` + text); notify("클립보드에 복사했습니다."); } catch { notify("복사에 실패했습니다.", "error"); }
  };
  const printIt = () => window.print();

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between print:hidden">
        <button onClick={() => setView(returnView || "childDetail")} className="flex items-center gap-1 text-sm text-slate-500 hover:text-blue-900">
          <ChevronLeft className="w-4 h-4" />
          {returnView === "deepList" ? "집중브리핑 모아보기로" : returnView === "schedule" ? "수업 기록으로" : returnView === "dashboard" ? "대시보드로" : `${child.name} 학생 페이지로`}
        </button>
        {allDeepForChild.length > 1 && (
          <select value={deep.id} onChange={e => setSelectedDeepId(e.target.value)} className="text-xs border border-slate-200 rounded-lg px-2 py-1.5">
            {allDeepForChild.map((d, i) => <option key={d.id} value={d.id}>{allDeepForChild.length - i}차 · {formatDate(d.createdAt)} · {d.status === "final" ? "확정" : d.status === "reviewing" ? "검토중" : "초안"}</option>)}
          </select>
        )}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-5 print:border-0 print:rounded-none print:p-0">
        <div className="flex items-center justify-between mb-1 print:mb-3">
          <div>
            <h1 className="text-xl font-bold text-slate-800 print:text-[16pt]">{child.name} 학생 심화브리핑</h1>
            <p className="text-xs text-slate-400 mt-1 print:text-[9pt]">대상 기록: {sourceBriefings.map(b => formatDate(b.date)).join(", ")}</p>
          </div>
          <Badge color={deep.status === "final" ? "green" : deep.status === "reviewing" ? "purple" : "blue"}>{deep.status === "final" ? "최종 확정" : deep.status === "reviewing" ? "검토 중 (초안)" : "초안 생성"}</Badge>
        </div>

        {deep.status !== "final" && (
          <div className="flex items-center gap-1.5 text-[11px] text-amber-600 bg-amber-50 rounded-lg px-3 py-1.5 mb-4 w-fit print:hidden">
            <Info className="w-3.5 h-3.5" /> 최종 확정 전에는 학부모에게 전달되지 않는 검토용 초안입니다.
          </div>
        )}

        <div className="space-y-4 mt-3 print:space-y-2">
          {SECTION_DEFS.map((s, i) => (
            <div key={s.key} className="print:break-inside-avoid">
              <div className="flex items-center justify-between mb-1 print:mb-0.5">
                <label className="text-xs font-semibold text-blue-900 print:text-[10.5pt]">{i + 1}. {s.label}</label>
                {deep.status !== "final" && (
                  <button disabled={regenSection === s.key} onClick={() => regenerateOne(s.key, s.label)} className="text-[11px] text-slate-400 hover:text-blue-900 flex items-center gap-1 print:hidden">
                    {regenSection === s.key ? <Loader2 className="w-3 h-3 animate-spin" /> : <RefreshCw className="w-3 h-3" />} 이 항목만 재생성
                  </button>
                )}
              </div>
              {deep.status !== "final" && (
                <input
                  value={instructions[s.key] || ""}
                  onChange={e => setInstruction(s.key, e.target.value)}
                  placeholder="이 항목의 수정 방향을 입력 (예: 아이의 또래 상호작용 변화를 더 구체적으로 써줘) - 비워두면 그냥 다시 생성만 합니다"
                  className="w-full border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px] text-slate-600 mb-1.5 print:hidden"
                />
              )}
              <AutoTextarea value={local[s.key] || ""} disabled={deep.status === "final"} onChange={e => setLocal({ ...local, [s.key]: e.target.value })} minRows={3} className="print:hidden" />
              <div className="hidden print:block whitespace-pre-wrap text-[10.5pt] leading-snug text-slate-800">{local[s.key] || ""}</div>

              {pendingRegen?.key === s.key && (
                <div className="mt-2 border border-amber-200 bg-amber-50 rounded-lg p-3 print:hidden">
                  <div className="text-[11px] font-semibold text-amber-700 mb-1.5 flex items-center gap-1"><Sparkles className="w-3 h-3" /> AI 수정 결과 (아직 적용 전 - 확인 후 적용해주세요)</div>
                  <p className="text-sm text-slate-700 whitespace-pre-wrap mb-2">{pendingRegen.text}</p>
                  <div className="flex gap-2">
                    <button onClick={applyPendingRegen} className="flex items-center gap-1 bg-blue-900 text-white text-xs font-medium px-3 py-1.5 rounded-lg hover:bg-blue-800"><CheckCircle2 className="w-3.5 h-3.5" /> 이 내용으로 적용</button>
                    <button onClick={discardPendingRegen} className="text-xs text-slate-500 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50">취소 (기존 내용 유지)</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>

        <div className="mt-4 pt-3 border-t border-slate-100 print:hidden space-y-2">
          <div>
            <div className="text-[11px] text-slate-400 mb-1.5">활용된 일일 브리핑</div>
            <div className="flex flex-wrap gap-1.5">{sourceBriefings.map(b => <Badge key={b.id} color="slate">{formatDate(b.date)} · {b.topic}</Badge>)}</div>
          </div>
          {deep.appliedReferences?.length > 0 && (
            <div>
              <div className="text-[11px] text-slate-400 mb-1.5">적용된 참고자료</div>
              <div className="flex flex-wrap gap-1.5">{deep.appliedReferences.map(r => <Badge key={r.id} color="slate">{r.category} · {r.title}</Badge>)}</div>
            </div>
          )}
        </div>
      </div>

      {deep.status !== "final" && (
        <div className="flex flex-wrap gap-2 print:hidden">
          <button onClick={regenerateAll} disabled={regenAll} className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-50">{regenAll ? <Loader2 className="w-4 h-4 animate-spin" /> : <RefreshCw className="w-4 h-4" />} 전체 다시 생성</button>
          <button onClick={saveDraft} className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-50"><Save className="w-4 h-4" /> 초안 저장</button>
          {deep.status !== "reviewing" && (
            <button onClick={() => onUpdate({ ...deep, sections: local, status: "reviewing", updatedAt: new Date().toISOString() })} className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-50"><ListChecks className="w-4 h-4" /> 관리자 검토로 전환</button>
          )}
          <button onClick={finalize} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800"><ShieldCheck className="w-4 h-4" /> 최종 확정</button>
        </div>
      )}
      <div className="flex flex-wrap gap-2 print:hidden">
        <button onClick={copyAll} className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-50"><Copy className="w-4 h-4" /> 복사</button>
        <button onClick={printIt} className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-50"><Printer className="w-4 h-4" /> 인쇄 / PDF 저장</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   참고자료 관리
--------------------------------------------------------- */
function ReferencesPage({ references, onAdd, onDelete }) {
  const [title, setTitle] = useState(""); const [category, setCategory] = useState(CATEGORIES[0]); const [content, setContent] = useState(""); const [fileNote, setFileNote] = useState("");
  const handleFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "txt") { setContent(await file.text()); setFileNote(`${file.name} 에서 텍스트를 불러왔습니다.`); }
    else if (ext === "docx") {
      try { const result = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() }); setContent(result.value); setFileNote(`${file.name} 에서 텍스트를 추출했습니다.`); }
      catch { setFileNote("DOCX 텍스트 추출에 실패했습니다. 내용을 직접 붙여넣어주세요."); }
    } else if (ext === "pdf") setFileNote("PDF는 자동 추출을 지원하지 않습니다. 본문을 복사해 아래에 붙여넣어주세요.");
    else setFileNote("지원하지 않는 형식입니다. TXT 또는 DOCX 파일을 사용해주세요.");
  };
  const submit = () => { if (!title || !content) return; onAdd({ id: uid(), title, category, content, uploadedAt: new Date().toISOString() }); setTitle(""); setContent(""); setFileNote(""); };

  return (
    <div className="space-y-5">
      <h1 className="text-2xl font-bold text-slate-800">참고자료 관리</h1>
      <p className="text-sm text-slate-500">심화브리핑 작성 시 해석 기준으로 활용될 자료입니다. 본문 문장이 그대로 복사되지 않고, AI가 일일 브리핑을 해석하고 다음 수업 방향을 정하는 기준으로만 사용합니다.</p>
      <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
        <div className="grid sm:grid-cols-2 gap-3">
          <div><label className="text-xs text-slate-500">제목</label><input value={title} onChange={e => setTitle(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" placeholder="예) 남아 발달 특성 - 8세 전후" /></div>
          <div><label className="text-xs text-slate-500">분류</label><select value={category} onChange={e => setCategory(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">{CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></div>
        </div>
        <div><label className="text-xs text-slate-500">파일 업로드 (TXT, DOCX 지원 · PDF는 텍스트 붙여넣기)</label><input type="file" accept=".txt,.docx,.pdf" onChange={handleFile} className="w-full text-sm mt-1" />{fileNote && <p className="text-[11px] text-blue-900 mt-1">{fileNote}</p>}</div>
        <div><label className="text-xs text-slate-500">내용</label><textarea value={content} onChange={e => setContent(e.target.value)} rows={5} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        <div className="flex justify-end"><button onClick={submit} disabled={!title || !content} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800 disabled:opacity-40"><Plus className="w-4 h-4" /> 참고자료 등록</button></div>
      </div>
      <div className="space-y-2">
        {CATEGORIES.map(cat => {
          const items = references.filter(r => r.category === cat); if (items.length === 0) return null;
          return (
            <div key={cat}>
              <div className="text-xs font-semibold text-slate-400 mb-1.5 mt-3">{cat}</div>
              <div className="space-y-2">
                {items.map(r => (
                  <div key={r.id} className="bg-white rounded-xl border border-slate-200 p-4 flex items-start justify-between gap-3">
                    <div className="min-w-0"><div className="text-sm font-semibold text-slate-800">{r.title}</div><p className="text-xs text-slate-500 mt-1 line-clamp-2">{r.content}</p></div>
                    <button onClick={() => { if (confirm("삭제할까요?")) onDelete(r.id); }} className="p-1.5 rounded-md hover:bg-red-50 text-red-400 shrink-0"><Trash2 className="w-3.5 h-3.5" /></button>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
        {references.length === 0 && <p className="text-sm text-slate-400 text-center py-10">등록된 참고자료가 없습니다.</p>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   월간 자라다 - 반별 월간 선정 내역 등록/관리
--------------------------------------------------------- */
function MonthlyStarManager({ className, classNames, children, teachers, monthlyStars, onAdd, onEdit, onDelete, notify }) {
  const isAll = !className;
  const classNameByTeacher = Object.fromEntries(teachers.map(t => [t.name, t.className]));

  // 전체보기(className 없음)일 때는 등록 폼에서 반을 직접 골라야 합니다.
  const [formClassName, setFormClassName] = useState(className || classNames[0] || "");
  useEffect(() => { setFormClassName(className || classNames[0] || ""); }, [className]);
  const activeClassName = isAll ? formClassName : className;

  const roster = children.filter(c => classNameByTeacher[c.teacher] === activeClassName && c.status !== "withdrawn").sort((a, b) => a.name.localeCompare(b.name, "ko"));

  const nowYear = new Date().getFullYear();
  const blank = { className: activeClassName, year: nowYear, month: new Date().getMonth() + 1, childName: roster[0]?.name || "", issueNumber: "", reason: "" };
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);
  const [useCustomName, setUseCustomName] = useState(roster.length === 0);
  const [rowClassFilter, setRowClassFilter] = useState("all");

  useEffect(() => {
    setForm({ ...blank, childName: roster[0]?.name || "" });
    setEditingId(null);
    setUseCustomName(roster.length === 0);
    // eslint-disable-next-line
  }, [activeClassName]);

  const startEdit = (r) => {
    setForm({ className: r.className, year: r.year, month: r.month, childName: r.childName, issueNumber: r.issueNumber, reason: r.reason });
    setEditingId(r.id);
    if (isAll) setFormClassName(r.className);
    setUseCustomName(!children.some(c => classNameByTeacher[c.teacher] === r.className && c.name === r.childName));
  };
  const cancelEdit = () => { setForm({ ...blank, childName: roster[0]?.name || "" }); setEditingId(null); setUseCustomName(roster.length === 0); };

  const submit = () => {
    if (!form.className || !form.year || !form.month || !form.childName.trim() || !form.issueNumber.trim()) { notify("반, 연도, 월, 학생 이름, 호수는 필수입니다.", "error"); return; }
    if (editingId) onEdit({ id: editingId, ...form });
    else onAdd(form);
    cancelEdit();
  };

  const rows = monthlyStars
    .filter(r => isAll ? (rowClassFilter === "all" || r.className === rowClassFilter) : r.className === className)
    .sort((a, b) => (b.year - a.year) || (b.month - a.month) || new Date(b.createdAt) - new Date(a.createdAt));

  return (
    <div className="space-y-5">
      <div>

            ) : (
              <select value={form.childName} onChange={e => setForm({ ...form, childName: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">
                {roster.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
              </select>
            )}
          </div>
          <div>
            <label className="text-xs text-slate-500">월간 자라다 호수</label>
            <input value={form.issueNumber} onChange={e => setForm({ ...form, issueNumber: e.target.value })} placeholder="예) 37호" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" />

        <div><label className="text-xs text-slate-500">선정 사유</label><textarea value={form.reason} onChange={e => setForm({ ...form, reason: e.target.value })} rows={3} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" placeholder="선정 사유를 입력해주세요" /></div>
        <div className="flex justify-end gap-2">

          <button onClick={submit} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800">
            {editingId ? <><Save className="w-4 h-4" /> 수정 저장</> : <><Plus className="w-4 h-4" /> 등록</>}

      </div>

      {isAll && (
        <div className="flex items-center gap-2">
          <label className="text-xs text-slate-500">반 필터</label>
          <select value={rowClassFilter} onChange={e => setRowClassFilter(e.target.value)} className="border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm">
            <option value="all">전체 반</option>
            {classNames.map(cn => <option key={cn} value={cn}>{cn}</option>)}
          </select>

      {rows.length === 0 ? (
        <div className="bg-white rounded-xl border border-slate-200 border-dashed p-10 text-center text-sm text-slate-400">

      ) : (
        <div className="bg-white rounded-xl border border-slate-200 p-5">
          <div className="hidden sm:block overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[11px] text-slate-400 border-b border-slate-100">
                  {isAll && <th className="pb-2 font-medium">반</th>}
                  <th className="pb-2 font-medium">연도</th>
                  <th className="pb-2 font-medium">월</th>
                  <th className="pb-2 font-medium">학생</th>
                  <th className="pb-2 font-medium">호수</th>
                  <th className="pb-2 font-medium">선정 사유</th>
                  <th className="pb-2 font-medium text-right">관리</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.id} className="border-b border-slate-50 last:border-0 align-top">
                    {isAll && <td className="py-2"><Badge color="slate">{r.className}</Badge></td>}
                    <td className="py-2 text-slate-600">{r.year}</td>
                    <td className="py-2 text-slate-600">{r.month}월</td>
                    <td className="py-2 font-medium text-slate-800">{r.childName}</td>

                    <td className="py-2 text-right whitespace-nowrap">
                      <button onClick={() => startEdit(r)} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>

                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="sm:hidden space-y-2">
            {rows.map(r => (
              <div key={r.id} className="border border-slate-100 rounded-lg p-3">
                <div className="flex items-center justify-between mb-1">
                  <div className="text-sm font-semibold text-slate-800 flex items-center gap-2">
                    {r.childName}
                    {isAll && <span className="text-slate-400 font-normal text-xs">· {r.className}</span>}
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => startEdit(r)} className="p-1 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>
                    <button onClick={() => { if (confirm("삭제할까요?")) onDelete(r.id); }} className="p-1 rounded-md hover:bg-red-50 text-red-400"><Trash2 className="w-3.5 h-3.5" /></button>
                  </div>
                </div>
                <div className="text-xs text-slate-400">{r.year}년 {r.month}월 · {r.issueNumber}</div>
                <div className="text-xs text-slate-500 mt-1">{r.reason}</div>

      )}
    </div>
  );
}

/* ---------------------------------------------------------
   수업 기록: 요일 → 교시 → 아이 트리
--------------------------------------------------------- */
function childStatus(childId, date, briefings, attendance, draftIndex) {
  const att = attendance.find(a => a.childId === childId && a.date === date);
  if (att) return att.type; // 'absent' | 'cancelled'
  // 보충수업으로 추가된 두 번째 기록은 그 날짜의 "정규" 완료 여부에 영향을 주지 않습니다.
  const done = briefings.some(b => b.childId === childId && b.date === date && b.status === "completed" && !b.isMakeup);
  if (done) return "completed";
  if (draftIndex[`${childId}|${date}`]) return "draft";
  return "empty";
}

function StatusIcon({ status }) {
  if (status === "completed") return <CheckCircle2 className="w-3.5 h-3.5 text-emerald-600" />;
  if (status === "draft") return <Clock className="w-3.5 h-3.5 text-amber-500" />;
  if (status === "absent") return <UserX className="w-3.5 h-3.5 text-slate-400" />;
  if (status === "cancelled") return <CalendarOff className="w-3.5 h-3.5 text-slate-400" />;
  return <FileText className="w-3.5 h-3.5 text-slate-300" />;
}

function ScheduleTree({ schedule, children, teachers = [], classFilter, briefings, attendance, draftIndex, role, teacherName, date, selectedChildId, onSelect, target, onManage }) {
  const [expandedDays, setExpandedDays] = useState(() => new Set(target ? [target.day] : [DAYS[0]]));
  const [expandedSlots, setExpandedSlots] = useState(() => new Set(target ? [target.slotId] : []));
  const childById = Object.fromEntries(children.map(c => [c.id, c]));
  const classNameByTeacher = Object.fromEntries(teachers.map(t => [t.name, t.className]));

  useEffect(() => {
    if (target) {
      setExpandedDays(prev => new Set([...prev, target.day]));
      setExpandedSlots(prev => new Set([...prev, target.slotId]));
    }
  }, [target]);

  const toggleDay = (d) => setExpandedDays(prev => { const n = new Set(prev); n.has(d) ? n.delete(d) : n.add(d); return n; });
  const toggleSlot = (id) => setExpandedSlots(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  let visibleSchedule = schedule;
  if (classFilter) visibleSchedule = visibleSchedule.filter(s => classNameByTeacher[s.teacher] === classFilter);

  return (
    <div className="space-y-1">
      {DAYS.map(day => {
        const slots = visibleSchedule.filter(s => s.day === day).sort((a, b) => a.order - b.order);
        const dayOpen = expandedDays.has(day);
        return (
          <div key={day} className="border border-slate-200 rounded-lg overflow-hidden bg-white">
            <button onClick={() => toggleDay(day)} className="w-full flex items-center justify-between px-3 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
              <span>{day}요일</span>
              <ChevronDown className={`w-4 h-4 text-slate-400 transition-transform ${dayOpen ? "rotate-180" : ""}`} />
            </button>
            {dayOpen && (
              <div className="border-t border-slate-100">
                {slots.length === 0 && <p className="text-xs text-slate-300 px-4 py-3">등록된 교시가 없습니다.</p>}
                {slots.map(slot => {
                  const open = expandedSlots.has(slot.id);
                  const relevant = slot.childIds.filter(cid => childStatus(cid, date, briefings, attendance, draftIndex) !== "cancelled" || true);
                  const doneCount = slot.childIds.filter(cid => childStatus(cid, date, briefings, attendance, draftIndex) === "completed").length;
                  return (
                    <div key={slot.id} className="border-b border-slate-50 last:border-b-0">
                      <button onClick={() => toggleSlot(slot.id)} className="w-full flex items-center justify-between px-4 py-2 text-sm hover:bg-slate-50">
                        <span className="flex items-center gap-2 text-slate-600">
                          <ChevronRight className={`w-3.5 h-3.5 text-slate-300 transition-transform ${open ? "rotate-90" : ""}`} />
                          {day} {slot.name} <span className="text-[11px] text-slate-400">{slot.startTime}-{slot.endTime}</span>
                        </span>
                        <span className="text-[11px] text-slate-400">{doneCount}/{slot.childIds.length}명 완료</span>
                      </button>
                      {open && (
                        <div className="pb-1">
                          {slot.childIds.length === 0 && <p className="text-xs text-slate-300 pl-10 py-2">배정된 아이가 없습니다.</p>}
                          {slot.childIds.map(cid => {
                            const c = childById[cid]; if (!c) return null;
                            const st = childStatus(cid, date, briefings, attendance, draftIndex);
                            const selected = selectedChildId === cid;
                            return (
                              <button key={cid} onClick={() => onSelect(c, slot)} className={`w-full flex items-center justify-between pl-10 pr-4 py-2 text-sm ${selected ? "bg-blue-900 text-white" : "hover:bg-slate-50 text-slate-700"}`}>
                                <span>{c.name} <span className={selected ? "text-blue-200" : "text-slate-400"}>{c.age}</span></span>
                                <StatusIcon status={st} />
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      <button onClick={onManage} className="w-full mt-2 flex items-center justify-center gap-1.5 text-sm text-blue-900 font-medium border border-dashed border-blue-200 rounded-lg py-2.5 hover:bg-blue-50">
        <Edit2 className="w-3.5 h-3.5" /> 요일 · 교시 관리
      </button>
    </div>
  );
}

function DailyBriefingPanel({ child, slot, date, setDate, briefings, references, deepBriefings, testMode, onSubmit, onDelete, onSaveDraft, onMarkAbsent, onCancelSlot, onSaveFocusedDeep, goToChild, allBriefingsForChild, notify, onBack, isMobile, setSelectedDeepId, setView }) {
  const [isMakeup, setIsMakeup] = useState(false);
  const draftKey = `draft:${child.id}:${date}:${isMakeup ? "makeup" : "regular"}`;
  const existing = briefings.find(b => b.childId === child.id && b.date === date && b.status === "completed" && !!b.isMakeup === isMakeup);
  const hasRegularForDate = briefings.some(b => b.childId === child.id && b.date === date && b.status === "completed" && !b.isMakeup);
  const hasMakeupForDate = briefings.some(b => b.childId === child.id && b.date === date && b.status === "completed" && b.isMakeup);
  const [form, setForm] = useState({ topic: "", teacherSummary: "", antecedent: "", behavior: "", consequence: "" });
  const [loaded, setLoaded] = useState(false);
  const [savedNote, setSavedNote] = useState("");
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [showPicker, setShowPicker] = useState(false);
  const [pickerIds, setPickerIds] = useState(() => new Set());
  const [focusedGenerating, setFocusedGenerating] = useState(false);
  const [focusedRegenKey, setFocusedRegenKey] = useState(null);
  const [focusedDraft, setFocusedDraft] = useState(null); // { sections, batch, isTestMode }
  const [focusedInstructions, setFocusedInstructions] = useState({});
  const [focusedPendingRegen, setFocusedPendingRegen] = useState(null); // { key, text }
  const [focusedViewMode, setFocusedViewMode] = useState("edit"); // 'edit' | 'document'
  const focusedDocRef = useRef(null);
  const timer = useRef(null);

  // 아이나 날짜가 바뀌면 보충수업 선택은 항상 기본(일반 기록)으로 되돌립니다.
  useEffect(() => {
    setIsMakeup(false);
    // eslint-disable-next-line
  }, [child.id, date]);

  useEffect(() => {
    setLoaded(false);
    (async () => {
      if (existing) { setForm({ topic: existing.topic, teacherSummary: existing.teacherSummary, antecedent: existing.antecedent, behavior: existing.behavior, consequence: existing.consequence }); }
      else {
        const d = await loadKey(draftKey, null, false);
        if (d) setForm(d);
        else setForm({ topic: "", teacherSummary: "", antecedent: "", behavior: "", consequence: "" });
      }
      setLoaded(true);
    })();
    // eslint-disable-next-line
  }, [child.id, date, isMakeup]);

  const set = (k, v) => {
    const next = { ...form, [k]: v }; setForm(next); clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      await saveKey(draftKey, next, false);
      await onSaveDraft(child.id, date, true);
      setSavedNote("자동 임시저장됨 · " + new Date().toLocaleTimeString("ko-KR"));
    }, 900);
  };

  const complete = async () => {
    if (!form.topic) { notify("수업 주제를 입력해주세요.", "error"); return; }
    await deleteKey(draftKey, false);
    await onSaveDraft(child.id, date, false);
    onSubmit({
      id: existing ? existing.id : uid(), childId: child.id, date, day: slot.day, slotId: slot.id, slotLabel: `${slot.day} ${slot.name}`,
      week: weekLabel(date), status: "completed", isMakeup, ...form,
      createdAt: existing ? existing.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
    });
    notify(isMakeup ? "보충수업 기록이 작성 완료 처리되었습니다." : "작성 완료 처리되었습니다.");
  };

  // 날짜를 잘못 기록했을 때, 새 기록을 만드는 대신 "이미 완료된 기록 자체"의 날짜를
  // 고쳐서 같은 기록을 그대로 새 날짜로 옮깁니다 (중복 생성 방지).
  const changeRecordDate = async (newDate) => {
    if (existing && newDate !== date) {
      await onSubmit({ ...existing, date: newDate, week: weekLabel(newDate), updatedAt: new Date().toISOString() });
      notify(`기록 날짜를 ${formatDate(newDate)}로 수정했습니다.`);
    }
    setDate(newDate);
  };

  // 이미 내용을 다 써놓은 기존 기록을 "보충수업 ↔ 일반 수업기록"으로 다시 태그만 바꿉니다.
  // (체크박스처럼 빈 화면으로 이동하는 게 아니라, 같은 기록의 내용을 그대로 유지한 채 분류만 전환합니다.)
  const toggleExistingMakeup = async () => {
    if (!existing) return;
    const target = !isMakeup;
    const conflict = briefings.find(b => b.childId === child.id && b.date === date && b.status === "completed" && !!b.isMakeup === target && b.id !== existing.id);
    if (conflict) {
      notify("이미 해당 날짜에 그 상태의 다른 기록이 있어서 전환할 수 없습니다. 아래 타임라인에서 기존 기록을 먼저 확인해주세요.", "error");
      return;
    }
    await onSubmit({ ...existing, isMakeup: target, updatedAt: new Date().toISOString() });
    // 전환 후 예전에 남아있던 임시저장(초안)이 있으면 지워서, 반대쪽(일반/보충)을
    // 다시 눌렀을 때 화면이 옛날 내용으로 굳어 보이지 않고 제대로 빈 화면으로 바뀌게 합니다.
    await deleteKey(`draft:${child.id}:${date}:regular`, false);
    await deleteKey(`draft:${child.id}:${date}:makeup`, false);
    await onSaveDraft(child.id, date, false);
    setIsMakeup(target);
    notify(target ? "이 기록을 보충수업 기록으로 전환했습니다. (내용은 그대로 유지됩니다)" : "이 기록을 일반 수업기록으로 전환했습니다. (내용은 그대로 유지됩니다)");
  };

  const saveManual = async () => { await saveKey(draftKey, form, false); await onSaveDraft(child.id, date, true); notify("임시 저장했습니다."); };

  const loadRecent = () => {
    const pastList = allBriefingsForChild.filter(b => b.status === "completed" && b.date !== date).sort((a, b) => new Date(b.date) - new Date(a.date));
    if (pastList.length === 0) { notify("불러올 이전 기록이 없습니다.", "error"); return; }
    const last = pastList[pastList.length - 1];
    setForm({ topic: last.topic, teacherSummary: last.teacherSummary, antecedent: last.antecedent, behavior: last.behavior, consequence: last.consequence });
    notify("최근 기록을 불러왔습니다. 필요한 부분을 수정해주세요.");
  };

  const idx = slot.childIds.indexOf(child.id);
  const prevId = idx > 0 ? slot.childIds[idx - 1] : null;
  const nextId = idx < slot.childIds.length - 1 ? slot.childIds[idx + 1] : null;

  const past = allBriefingsForChild.filter(b => b.status === "completed").sort((a, b) => new Date(b.date) - new Date(a.date));
  const myFocusedBriefings = (deepBriefings || []).filter(d => d.childId === child.id);
  const timelineItems = [
    ...past.map(b => ({ type: "daily", key: `daily-${b.id}`, date: b.date, data: b })),
    ...myFocusedBriefings.map(d => ({ type: "focused", key: `focused-${d.id}`, date: (d.createdAt || "").slice(0, 10), data: d })),
  ].sort((a, b) => {
    if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
    return a.type === "daily" ? -1 : 1;
  });

  const toggleExpand = (key) => setExpandedIds(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const togglePick = (id) => setPickerIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const openPicker = () => { setPickerIds(new Set()); setShowPicker(true); };

  const generateFocused = async () => {
    const batch = past.filter(b => pickerIds.has(b.id)).sort((a, b) => new Date(a.date) - new Date(b.date));
    if (batch.length === 0) { notify("하나 이상의 기록을 선택해주세요.", "error"); return; }
    setFocusedGenerating(true);
    try {
      let sections;
      if (testMode) sections = mockGenerate(child, batch);
      else sections = await generateIntensiveBriefing(child, batch, references);
      setFocusedDraft({ sections, batch, isTestMode: testMode });
      setFocusedViewMode("edit");
      setFocusedInstructions({});
      setFocusedPendingRegen(null);
      setShowPicker(false);
    } catch (e) {
      console.error("집중브리핑 생성 실패:", e);
      notify(`집중브리핑 생성에 실패했습니다: ${e?.message || e}`, "error");
    }
    setFocusedGenerating(false);
  };

  const regenerateFocusedSection = async (key) => {
    if (!focusedDraft) return;
    setFocusedRegenKey(key);
    setFocusedPendingRegen(null);
    try {
      let text;
      const instruction = (focusedInstructions[key] || "").trim();
      if (testMode) text = mockGenerate(child, focusedDraft.batch)[key];
      else text = await regenerateBriefingSection(child, focusedDraft.batch, key, focusedDraft.sections, instruction || undefined, references);
      // 바로 덮어쓰지 않고 미리 보여준 뒤, 확인하고 적용하도록 합니다.
      setFocusedPendingRegen({ key, text });
    } catch (e) {
      console.error("항목 재생성 실패:", e);
      notify("항목 재생성에 실패했습니다. 잠시 후 다시 시도해주세요.", "error");
    }
    setFocusedRegenKey(null);
  };

  const applyFocusedPendingRegen = () => {
    if (!focusedPendingRegen) return;
    setFocusedDraft(f => ({ ...f, sections: { ...f.sections, [focusedPendingRegen.key]: focusedPendingRegen.text } }));
    setFocusedPendingRegen(null);
  };
  const discardFocusedPendingRegen = () => setFocusedPendingRegen(null);

  const saveFocused = () => {
    if (!focusedDraft) return;
    onSaveFocusedDeep(child, focusedDraft.batch, focusedDraft.sections);
    notify("집중브리핑이 저장되었습니다. 아래 타임라인에서 확인할 수 있습니다.");
    setFocusedDraft(null);
    setFocusedPendingRegen(null);
    setFocusedInstructions({});
  };

  const copyFocusedAll = async () => {
    if (!focusedDraft) return;
    const text = SECTION_DEFS.map((s, i) => `${i + 1}. ${s.label}\n${focusedDraft.sections[s.key] || ""}`).join("\n\n");
    try {
      await navigator.clipboard.writeText(`${child.name} 학생 집중브리핑\n\n` + text);
      notify("전체 내용을 클립보드에 복사했습니다.");
    } catch { notify("복사에 실패했습니다.", "error"); }
  };

  const handleFocusedDocKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a") {
      e.preventDefault();
      const sel = window.getSelection();
      if (!sel || !focusedDocRef.current) return;
      sel.removeAllRanges();
      const range = document.createRange();
      range.selectNodeContents(focusedDocRef.current);
      sel.addRange(range);
    }
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <button onClick={onBack} style={{ display: isMobile ? "flex" : "none" }} className="items-center gap-1 text-sm text-slate-500"><ArrowLeft className="w-4 h-4" /> 명단으로</button>
        <div className="flex items-center gap-2 ml-auto">
          <button disabled={!prevId} onClick={() => goToChild(prevId, slot)} className="p-1.5 rounded-lg border border-slate-200 text-slate-500 disabled:opacity-30 hover:bg-slate-50"><ArrowLeft className="w-3.5 h-3.5" /></button>
          <button disabled={!nextId} onClick={() => goToChild(nextId, slot)} className="p-1.5 rounded-lg border border-slate-200 text-slate-500 disabled:opacity-30 hover:bg-slate-50"><ArrowRight className="w-3.5 h-3.5" /></button>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <div style={{ wordBreak: "keep-all", whiteSpace: "normal" }} className="flex flex-wrap items-center gap-x-8 gap-y-3 mb-4 pb-4 border-b border-slate-100 text-sm">
          <div className="flex items-baseline gap-2"><span className="text-[11px] text-slate-400">아이 이름</span><span className="font-semibold text-slate-800">{child.name}</span></div>
          <div className="flex items-baseline gap-2"><span className="text-[11px] text-slate-400">나이</span><span className="font-semibold text-slate-800">{child.age}세</span></div>
          <div className="flex items-baseline gap-2"><span className="text-[11px] text-slate-400">담당 교사</span><span className="font-semibold text-slate-800">{slot.teacher} 선생님</span></div>
          <div className="flex items-baseline gap-2">
            <span className="text-[11px] text-slate-400">수업일{existing ? " (수정 가능)" : ""}</span>
            <input type="date" value={date} onChange={e => changeRecordDate(e.target.value)} className="font-semibold text-slate-800 border-0 p-0 focus:ring-0 text-sm w-auto" />
          </div>
          <div className="flex items-baseline gap-2"><span className="text-[11px] text-slate-400">수업 주차</span><span className="font-semibold text-slate-800">{weekLabel(date)}</span></div>
          <div className="flex items-baseline gap-2"><span className="text-[11px] text-slate-400">요일 및 교시</span><span className="font-semibold text-slate-800">{slot.day}요일 {slot.name}</span></div>
          <label className={`flex items-center gap-1.5 text-xs font-medium rounded-lg px-2.5 py-1.5 cursor-pointer border ${isMakeup ? "bg-amber-50 border-amber-300 text-amber-700" : "bg-white border-slate-200 text-slate-500"}`}>
            <input type="checkbox" checked={isMakeup} onChange={e => setIsMakeup(e.target.checked)} className="accent-amber-600" />
            보충수업 (같은 날짜 추가 기록)
          </label>
        </div>
        {isMakeup && (
          <div className="mb-4 -mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 flex items-center justify-between gap-2 flex-wrap">
            <span>
              보충수업 기록을 작성하고 있습니다. {date} 날짜에 이미 있는 일반 수업기록과 별개로 저장됩니다.
              {hasMakeupForDate && !existing && " (참고: 해당 날짜에 다른 보충수업 기록이 이미 있다면 아래에서 함께 확인할 수 있어요.)"}
            </span>
            {existing && (
              <button onClick={toggleExistingMakeup} className="shrink-0 flex items-center gap-1 text-amber-800 font-medium hover:underline">
                <Edit2 className="w-3 h-3" /> 이 기록을 일반 수업기록으로 전환 (내용 유지)
              </button>
            )}
          </div>
        )}
        {!isMakeup && hasMakeupForDate && (
          <div className="mb-4 -mt-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
            이 날짜에는 보충수업 기록도 함께 있습니다. 아래 타임라인에서 확인할 수 있어요.
          </div>
        )}
        {!isMakeup && existing && (
          <div className="mb-4 -mt-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 flex items-center justify-between gap-2 flex-wrap">
            <span>이미 작성된 기록입니다. 사실은 이 기록이 보충수업 기록이었다면 아래 버튼으로 내용을 그대로 유지한 채 전환할 수 있어요.</span>
            <button onClick={toggleExistingMakeup} className="shrink-0 flex items-center gap-1 text-blue-900 font-medium hover:underline">
              <Edit2 className="w-3 h-3" /> 이 기록을 보충수업으로 전환 (내용 유지)
            </button>
          </div>
        )}

        {!loaded ? <div className="py-10 flex justify-center"><Loader2 className="w-5 h-5 animate-spin text-blue-900" /></div> : (

            <div><label className="text-xs text-slate-500">수업 주제</label><input value={form.topic} onChange={e => set("topic", e.target.value)} placeholder="예) 찰흙으로 동물 만들기" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
            <div><label className="text-xs text-slate-500 font-medium">교사 종합 브리핑</label><AutoTextarea value={form.teacherSummary} onChange={e => set("teacherSummary", e.target.value)} /></div>
            {[
              ["antecedent", "선행사건 (그 행동 직전에 무엇이 있었는가?)", "예) 어려운 작업을 제시함 / 교사가 다른 아이를 칭찬함 / 친구가 재료를 가져감 / 수업 종료시간을 안내함"],
              ["behavior", "행동 (정확히 무엇이 있었는가)", "예) 재료를 바닥에 던졌다 / 책상을 크게 내려쳤다 — 누가 보더라도 비슷하게 판단할 수 있는 행동으로 객관적으로 기록"],
              ["consequence", "결과 (그 행동 직후 무엇이 일어났는가)", "예) 과제가 중단됨 / 선생님이 아이 옆으로 감 / 친구들이 아이를 바라봄 / 원하는 재료를 받음 / 별도 공간으로 이동"],
            ].map(([k, label, ph]) => (
              <div key={k}><label className="text-xs text-slate-500 font-medium">{label}</label><AutoTextarea value={form[k]} onChange={e => set(k, e.target.value)} placeholder={ph} /></div>

          </div>
        )}

        <div className="flex items-center justify-between mt-4 pt-3 border-t border-slate-100 flex-wrap gap-2">
          <span className="text-[11px] text-slate-400 flex items-center gap-1">{savedNote && <><Save className="w-3 h-3" />{savedNote}</>}</span>
          <div className="flex gap-2 flex-wrap">
            <button onClick={loadRecent} className="flex items-center gap-1 text-xs text-slate-500 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50"><History className="w-3.5 h-3.5" /> 최근 기록 불러오기</button>
            <button onClick={openPicker} className="flex items-center gap-1 text-xs text-amber-700 border border-amber-200 bg-amber-50 rounded-lg px-3 py-1.5 hover:bg-amber-100"><Sparkles className="w-3.5 h-3.5" /> 집중브리핑 작성하기</button>
            <button onClick={() => { if (confirm(`${child.name} 학생을 오늘(${date}) 결석 처리할까요?`)) onMarkAbsent(child.id, date, slot); }} className="flex items-center gap-1 text-xs text-slate-500 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50"><UserX className="w-3.5 h-3.5" /> 결석 처리</button>
            <button onClick={saveManual} className="flex items-center gap-1 text-xs text-slate-600 border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50"><Save className="w-3.5 h-3.5" /> 임시 저장</button>
            <button onClick={complete} className="flex items-center gap-1.5 bg-blue-900 text-white text-xs font-medium px-4 py-1.5 rounded-lg hover:bg-blue-800"><CheckCircle2 className="w-3.5 h-3.5" /> 작성 완료 처리</button>
          </div>
        </div>
      </div>

      <div className="flex flex-wrap gap-2">
        <button onClick={() => { const unwritten = slot.childIds.find(cid => cid !== child.id && childStatus(cid, date, briefings, [], {}) !== "completed"); if (unwritten) goToChild(unwritten, slot); else notify("같은 교시에 미작성 아이가 없습니다."); }}
          className="flex items-center gap-1.5 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-2 hover:bg-slate-50"><SkipForward className="w-4 h-4" /> 같은 교시 미작성 아이 확인</button>
        <button onClick={() => { if (confirm(`${slot.day} ${slot.name} 전체를 ${date} 휴강 처리할까요?`)) onCancelSlot(slot); }} className="flex items-center gap-1.5 text-sm text-slate-600 border border-slate-200 rounded-lg px-3 py-2 hover:bg-slate-50"><CalendarOff className="w-4 h-4" /> 교시 전체 휴강 처리</button>
        <button onClick={() => setView("deepList")} className="flex items-center gap-1.5 text-sm text-amber-700 border border-amber-200 bg-amber-50 rounded-lg px-3 py-2 hover:bg-amber-100"><FolderOpen className="w-4 h-4" /> 집중브리핑 모아보기</button>
      </div>

      {/* 수업기록 타임라인 - 날짜를 바꾸지 않아도 이 아이의 기록이 계속 누적되어 보입니다 */}
      <div className="bg-white rounded-xl border border-slate-200 p-4 space-y-2">
        <div className="text-xs font-semibold text-slate-500 flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5" /> {child.name} 학생 수업기록 타임라인 ({timelineItems.length}건)</div>
        {timelineItems.length === 0 && <p className="text-sm text-slate-400 py-2">아직 쌓인 기록이 없습니다.</p>}
        {timelineItems.map(item => {
          const open = expandedIds.has(item.key);
          if (item.type === "daily") {
            const b = item.data;
            const isCurrentlyOpen = b.date === date && !!b.isMakeup === isMakeup;
            return (
              <div key={item.key} id={`timeline-daily-${b.id}`} className={`border rounded-lg overflow-hidden ${isCurrentlyOpen ? "border-blue-300" : b.isMakeup ? "border-amber-200" : "border-slate-100"}`}>
                <button onClick={() => toggleExpand(item.key)} className="w-full text-left px-3 py-2.5 hover:bg-slate-50">
                  <div className="flex items-center justify-between gap-2">
                    <div className="text-xs font-medium text-slate-700">{formatDate(b.date)} · {b.week}{b.slotLabel ? ` · ${b.slotLabel}` : ""} · {b.topic}</div>
                    <div className="flex items-center gap-1.5 shrink-0">
                      {isCurrentlyOpen && <Badge color="blue">지금 편집 중</Badge>}
                      {b.isMakeup ? <Badge color="amber">보충수업</Badge> : <Badge color="slate">일반 수업기록</Badge>}
                    </div>
                  </div>
                  {!open && <div className="text-xs text-slate-400 mt-1 truncate">{b.teacherSummary}</div>}
                </button>
                {open && (
                  <div className="px-3 pb-3 text-xs text-slate-600 space-y-1.5 border-t border-slate-50 pt-2">
                    <div><span className="text-slate-400">교사 종합 브리핑 </span>{b.teacherSummary}</div>
                    <div><span className="text-slate-400">선행사건 </span>{b.antecedent}</div>
                    <div><span className="text-slate-400">행동 </span>{b.behavior}</div>
                    <div><span className="text-slate-400">결과 </span>{b.consequence}</div>
                    <div className="flex items-center gap-3 pt-1">
                      {!isCurrentlyOpen && (
                        <button
                          onClick={() => { setDate(b.date); setIsMakeup(!!b.isMakeup); notify("위쪽 작성 영역에서 이 기록을 수정할 수 있습니다."); }}
                          className="flex items-center gap-1 text-blue-900 font-medium hover:underline"
                        >
                          <Edit2 className="w-3 h-3" /> 이 기록 수정하기
                        </button>
                      )}
                      {onDelete && (
                        <button
                          onClick={() => { if (confirm(`${formatDate(b.date)} ${b.topic ? "· " + b.topic : ""} 기록을 삭제할까요? 되돌릴 수 없습니다.`)) onDelete(b.id); }}
                          className="flex items-center gap-1 text-red-500 font-medium hover:underline"
                        >
                          <Trash2 className="w-3 h-3" /> 삭제
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          }
          const d = item.data;
          const sourceDates = past.filter(b => d.sourceBriefingIds.includes(b.id)).map(b => b.date).sort();
          return (
            <div key={item.key} className="border border-amber-100 bg-amber-50/40 rounded-lg overflow-hidden">
              <button onClick={() => toggleExpand(item.key)} className="w-full text-left px-3 py-2.5 hover:bg-amber-50">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-xs font-medium text-slate-700 flex items-center gap-1.5"><Sparkles className="w-3.5 h-3.5 text-amber-500" /> {formatDate(d.createdAt)} 작성</div>
                  <Badge color="amber">집중브리핑</Badge>
                </div>
                {!open && <div className="text-xs text-slate-400 mt-1">{d.status === "final" ? "최종 확정" : d.status === "reviewing" ? "검토 중" : "초안"} · 참고 기록 {sourceDates.length}건</div>}
              </button>
              {open && (
                <div className="px-3 pb-3 text-xs text-slate-600 space-y-2 border-t border-amber-100 pt-2">
                  {SECTION_DEFS.map(s => (
                    <div key={s.key}><span className="text-slate-400">{s.label} </span>{d.sections?.[s.key]}</div>
                  ))}
                  <div className="pt-1">
                    <span className="text-slate-400">참고한 수업기록 </span>
                    {sourceDates.map(dt => {
                      const src = past.find(b => b.date === dt);
                      return (
                        <button
                          key={dt}
                          onClick={() => { if (src) { setExpandedIds(prev => new Set(prev).add(`daily-${src.id}`)); document.getElementById(`timeline-daily-${src.id}`)?.scrollIntoView({ behavior: "smooth", block: "center" }); } }}
                          className="inline-block bg-white border border-slate-200 rounded-full px-2 py-0.5 mr-1 mb-1 hover:border-blue-300 hover:text-blue-900"

                          {formatDate(dt)}
                        </button>

                  </div>
                  <button onClick={() => { setSelectedDeepId(d.id); setView("deepReview"); }} className="text-blue-900 font-medium hover:underline">자세히 보기 · 수정하기 →</button>

      </div>

            </div>

            <div className="space-y-2">
              {past.length === 0 && <p className="text-sm text-slate-400">선택할 수 있는 기록이 없습니다.</p>}

                <label key={b.id} className="flex items-start gap-2 border border-slate-100 rounded-lg p-3 cursor-pointer hover:bg-slate-50">
                  <input type="checkbox" checked={pickerIds.has(b.id)} onChange={() => togglePick(b.id)} className="mt-0.5 shrink-0" />
                  <div className="min-w-0">
                    <div className="text-sm font-medium text-slate-800">{formatDate(b.date)} · {b.topic}</div>

                  </div>

function ScheduleManager({ schedule, children, teachers = [], onSave, onClose }) {
  const blank = { day: "월", name: "", startTime: "13:30", endTime: "15:00", teacher: teachers[0]?.name || "", childIds: [], order: 1 };
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(blank);

  const startAdd = () => { setForm(blank); setEditing("new"); };
  const startEdit = (s) => { setForm(s); setEditing(s.id); };
  const toggleChild = (cid) => setForm(f => ({ ...f, childIds: f.childIds.includes(cid) ? f.childIds.filter(x => x !== cid) : [...f.childIds, cid] }));
  const save = () => {
    if (!form.name) return;
    const record = editing === "new" ? { ...form, id: uid() } : form;
    const next = editing === "new" ? [...schedule, record] : schedule.map(s => s.id === record.id ? record : s);
    onSave(next); setEditing(null);
  };
  const remove = (id) => { if (confirm("이 교시를 삭제할까요? 관련 기록은 유지됩니다.")) onSave(schedule.filter(s => s.id !== id)); };

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-40 p-4">
      <div className="bg-white rounded-xl w-full max-w-3xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between">
          <h3 className="font-bold text-slate-800">요일 · 교시 관리</h3>
          <button onClick={onClose}><X className="w-5 h-5 text-slate-400" /></button>
        </div>

        {editing ? (
          <div className="border border-slate-200 rounded-lg p-4 space-y-3">
            <div>
              <label className="text-xs text-slate-500">시간대 빠른 선택 (실제 수업시간표 기준)</label>
              <select
                onChange={e => {
                  const preset = presetsForDay(form.day)[Number(e.target.value)];
                  if (preset) setForm(f => ({ ...f, name: preset.label, startTime: preset.start, endTime: preset.end }));
                }}
                defaultValue="" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1"
              >
                <option value="">직접 입력</option>
                {presetsForDay(form.day).map((p, i) => <option key={i} value={i}>{p.label} {p.start}-{p.end}</option>)}
              </select>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <div><label className="text-xs text-slate-500">요일</label><select value={form.day} onChange={e => setForm({ ...form, day: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">{DAYS.map(d => <option key={d}>{d}</option>)}</select></div>
              <div><label className="text-xs text-slate-500">교시명</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="예) 3교시" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
              <div><label className="text-xs text-slate-500">표시 순서</label><input type="number" value={form.order} onChange={e => setForm({ ...form, order: Number(e.target.value) })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
              <div><label className="text-xs text-slate-500">시작 시간</label><input type="time" value={form.startTime} onChange={e => setForm({ ...form, startTime: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
              <div><label className="text-xs text-slate-500">종료 시간</label><input type="time" value={form.endTime} onChange={e => setForm({ ...form, endTime: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>

                <label className="text-xs text-slate-500">담당 교사</label>

                  <input value={form.teacher} onChange={e => setForm({ ...form, teacher: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" />
                ) : (
                  <select value={form.teacher} onChange={e => setForm({ ...form, teacher: e.target.value })} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1">
                    <option value="">선택</option>
                    {form.teacher && !teachers.some(t => t.name === form.teacher) && <option value={form.teacher}>{form.teacher} (미등록)</option>}
                    {teachers.map(t => <option key={t.id} value={t.name}>{t.name} ({t.className})</option>)}
                  </select>
                )}
              </div>
            </div>
            <div>
              <label className="text-xs text-slate-500">참여하는 아이 (다른 교시로 이동하려면 체크를 옮겨주세요)</label>

            </div>
