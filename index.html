function startOfWeek(d = new Date()) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

  const monday = startOfWeek(new Date(todayStr));

    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`);

  const monday = startOfWeek(new Date(anchorDateStr));

async function loadKey(key, fallback, shared = true) {
  try {
    if (!shared) {
      const raw = localStorage.getItem("jaerada:" + key);
      return raw === null ? fallback : JSON.parse(raw);
    }
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers: { apikey: SUPABASE_ANON_KEY } }
    );
    if (!res.ok) return fallback;
    const rows = await res.json();
    return rows.length ? rows[0].value : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveKey(key, value, shared = true) {
  try {
    if (!shared) { localStorage.setItem("jaerada:" + key, JSON.stringify(value)); return; }
    await fetch(`${SUPABASE_URL}/rest/v1/app_kv`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        "Content-Type": "application/json", Prefer: "resolution=merge-duplicates",
      },
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }),
    });
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}
async function deleteKey(key, shared = true) {
  try {
    if (!shared) { localStorage.removeItem("jaerada:" + key); return; }
    await fetch(`${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}`, {
      method: "DELETE",
      headers: { apikey: SUPABASE_ANON_KEY },
    });
  } catch (e) { /* noop */ }
}

// loadKey와 달리, 이 함수는 네트워크/서버 오류가 나면 "없는 값"으로 취급해 조용히
// 빈 값을 돌려주지 않고 실제로 예외를 던집니다. 화면 새로고침 로직에서 이걸 써야
// "일시적으로 서버 응답을 못 받은 것"과 "진짜로 데이터가 비어있는 것"을 구분해서,
// 일시적인 오류 때문에 화면의 실제 데이터가 빈 값으로 덮어써지는 일을 막을 수 있습니다.
async function loadKeyStrict(key) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/app_kv?key=eq.${encodeURIComponent(key)}&select=value`,
    { headers: { apikey: SUPABASE_ANON_KEY } }
  );
  if (!res.ok) throw new Error(`Supabase 응답 오류 (${key}): ${res.status}`);
  const rows = await res.json();
  return rows.length ? rows[0].value : undefined; // undefined = 서버에 진짜로 값이 없음
}

/* ---------------------------------------------------------
   로그인 계정 / 비밀번호 해시
   (참고: 이 앱은 별도 서버 인증이 없는 프로토타입입니다.
   비밀번호는 원문이 아닌 해시로 저장되지만, 브라우저에서만
   동작하는 클라이언트 인증이므로 실제 서비스 수준의 보안은
   아닙니다 — 화면 접근 통제 목적의 로그인으로 이해해주세요.
   미리보기 iframe 등 일부 환경에서 window.crypto.subtle이
   막혀 있을 수 있어, 별도 브라우저 API 없이 동작하는
   가벼운 자체 해시 함수를 사용합니다.)
--------------------------------------------------------- */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
}
function hashPassword(password, username) {
  return cyrb53(`jaerada-gireumwon:${username}:${password}`);
}

  const existingTitles = new Set((existingRefs || []).map(r => r.title));

// 참고자료(등록된 발달단계/상담문체/수업방향 등)에서 뽑아낸 "고정 작성 기준".
// 매번 원문 전체를 API에 보내는 대신, 핵심 기준만 짧게 정리해 시스템 프롬프트에 고정으로 포함합니다.
// (관리자가 참고자료 관리에서 등록한 원문은 화면에서 계속 보이지만, AI에는 이 요약 기준 + 실제 등록된 항목 제목 정도만 전달해 토큰을 아낍니다)
const FIXED_BRIEFING_STANDARD = [
  "성장 단계: 연령대별 정서·행동 특성을 감안해 눈높이에 맞는 설명으로 해석한다.",

  "상담 문체: 지난 수업과 연계된 오늘의 계획 → 성향에 근거한 관찰 → 가정 연계 지도 포인트 → 다음 방향 흐름을 따르고, 과장된 수식어를 줄인다.",
  "수업 방향: 재료와 경험의 다양화, 교사는 아이가 스스로 해낼 때까지 돕는 조력자라는 관점을 유지한다.",
].join("\n");

// 학부모 브리핑에서 부를 이름(성을 뺀 이름 부분)을 계산한다.
// 예) "김시우" -> "시우", "곽대연M" -> "대연" (동명이인 구분용 영문자는 제거)
function childGivenName(fullName) {
  if (!fullName) return "";
  const noSuffix = fullName.replace(/[a-zA-Z]+$/, "").trim();
  if (/^[가-힣]{2,4}$/.test(noSuffix)) return noSuffix.slice(1);
  return noSuffix || fullName;
}

// 한글 받침 유무에 따라 조사를 올바르게 붙인다 (우현+는 -> 우현이는, 시우+는 -> 시우는)
function hasFinalConsonant(name) {
  if (!name) return false;
  const code = name.charCodeAt(name.length - 1) - 0xAC00;
  if (code < 0 || code > 11171) return false; // 한글 음절이 아니면(영문 등) 받침 없음으로 취급
  return code % 28 !== 0;
}
// 아이 이름을 부를 때는 받침이 있으면 이름 뒤에 '이'를 붙이는 것이 자연스럽다 (이든 -> 이든이, 우현 -> 우현이).
// '이'가 붙으면 이후에는 받침이 없는 글자('이')를 기준으로 조사가 붙는다 (이든이는/이든이가), 받침이 없는 이름은 그대로 조사만 붙인다 (시우는/시우가).
function withChildSuffix(name) { return hasFinalConsonant(name) ? name + "이" : name; }
function withTopicParticle(name) { return withChildSuffix(name) + "는"; } // ~은/는 (아이 이름 기준: 이든이는, 시우는)
function withSubjectParticle(name) { return withChildSuffix(name) + "가"; } // ~이/가 (아이 이름 기준: 이든이가, 시우가)
function withObjectParticle(name) { return withChildSuffix(name) + "를"; } // ~을/를 (아이 이름 기준: 이든이를, 시우를)

// 등록된 참고자료의 실제 본문을 (문서당 일정 길이로 잘라서) 프롬프트에 넣는다.
// 예전에는 제목만 보내고 "고정 작성 기준"이라는 짧은 요약 문구만 썼는데, 그러면 관리자가
// 실제로 올린 자료 내용이 AI 해석에 전혀 반영되지 않는 문제가 있었다. 이제는 실제 등록된
// 자료 본문을 최대한 함께 보내 그 내용을 근거로 해석하도록 한다.
function formatReferencesForPrompt(references, maxPerDoc = 900) {
  if (!references || references.length === 0) return "(등록된 참고자료 없음)";
  return references.map(r => {
    const body = (r.content || "").trim();
    const trimmed = body.length > maxPerDoc ? body.slice(0, maxPerDoc) + " …(이하 생략)" : body;
    return `[${r.category}] ${r.title}\n${trimmed || "(본문 없음)"}`;
  }).join("\n\n");
}

function buildUserPrompt(child, batch, references) {
  const info = [
    `아이 이름: ${child.name}`,
    `나이/학년: ${child.age}세 / ${child.grade}`,
    `학부모의 주요 교육 니즈: ${child.parentNeeds || "(기록 없음)"}`,
    `수업 시 참고사항: ${child.classNotes || "(기록 없음)"}`,
  ].join("\n");

  // 선택된 기록의 실제 내용을 전부 전달한다 (날짜·제목만 보내지 않음)
  const records = batch.map((b, i) => [
    `[기록 ${i + 1}] ${b.date} (${b.week}) · ${b.slotLabel || ""} · 담당교사 ${child.teacher || ""}`,
    `수업 주제: ${b.topic}`,
    `교사 종합 브리핑: ${b.teacherSummary}`,
    `선행사건: ${b.antecedent}`,
    `행동: ${b.behavior}`,
    `결과: ${b.consequence}`,
  ].join("\n")).join("\n\n");

  return [
    `아래는 한 아이의 기본정보와 선택된 수업기록 ${batch.length}건이다. 선택된 기록만 사용해 집중브리핑을 작성하라.`,
    "\n[아이 기본정보]\n" + info,
    `\n[선택된 수업기록 ${batch.length}건 - 이 기록만 근거로 사용]\n` + records,
    "\n[학원에서 등록한 참고자료 원문 - 아래 내용을 실제 해석 기준으로 삼아, 관찰된 행동의 의미를 이 기준에 비춰 해석한다. 원문 문장을 그대로 베끼지 말고, 그 관점으로 이 아이의 기록을 해석한 결과만 자연스러운 문장으로 녹여 쓴다]\n" + formatReferencesForPrompt(references),
  ].join("\n");
}

function buildSectionUserPrompt(child, batch, section, currentSections, instruction, references) {
  const records = batch.map((b, i) => [
    `[기록 ${i + 1}] ${b.date} · 주제: ${b.topic}`,
    `교사 종합 브리핑: ${b.teacherSummary}`,
    `선행사건: ${b.antecedent} / 행동: ${b.behavior} / 결과: ${b.consequence}`,
  ].join("\n")).join("\n\n");
  const otherContext = SECTION_DEFS.filter(s => s.key !== section.key)
    .map(s => currentSections?.[s.key] ? `[${s.label}] ${currentSections[s.key]}` : null)
    .filter(Boolean).slice(0, 2).join("\n"); // 다른 항목과 중복되지 않도록 최소한의 맥락만 제공
  const currentText = currentSections?.[section.key] || "";
  return [
    `아래 선택된 수업기록 ${batch.length}건을 근거로 '${section.label}' 항목만 작성하라.`,
    "\n[선택된 수업기록]\n" + records,
    "\n[학원에서 등록한 참고자료 원문 - 실제 해석 기준으로 삼되, 원문을 그대로 베끼지 않는다]\n" + formatReferencesForPrompt(references, 600),
    otherContext ? "\n[다른 항목 맥락 - 내용 중복 방지용, 참고만]\n" + otherContext : "",
    currentText ? "\n[현재 작성되어 있는 이 항목의 내용 - 수정 방향 반영 전 원문]\n" + currentText : "",
    instruction
      ? `\n[교사가 지정한 이번 수정 방향 - 반드시 최우선으로 반영]\n${instruction}\n위 지시에 맞춰 이 항목을 다시 작성하라. 지시에서 다루지 않은 부분은 기존 내용의 취지를 최대한 유지한다.`
      : "",
  ].join("\n");
}

// 혹시 모델이 지시를 어기고 개발용 문구를 섞어 보내는 경우를 대비한 안전망 (본문에 절대 남지 않도록 제거)
function stripMetaPhrases(text) {
  if (!text) return text;
  let out = text;
  out = out.replace(/[(（][^()（）]*(?:AI\s*테스트\s*모드|자동\s*생성|프롬프트|테스트용 문장|개발자용 안내|시스템 설명|글자\s*수\s*안내)[^()（）]*[)）]/g, "");
  out = out.replace(/※[^\n]*(?:AI\s*테스트\s*모드|자동\s*생성|프롬프트)[^\n]*/g, "");
  return out.trim();
}

function parseSectionsJSON(text) {
  const cleaned = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  const out = {};
  SECTION_DEFS.forEach(s => { out[s.key] = stripMetaPhrases(parsed[s.key] || ""); });
  return out;
}

// AI 모델을 호출한다. Supabase Edge Function을 거쳐 OpenAI를 호출하며,
// OpenAI API 키는 이 코드 어디에도 없고 Supabase 서버의 Secret으로만 존재한다.
async function callAIModel(system, user) {
  if (OPENAI_PROXY_URL.includes("YOUR_PROJECT_ID")) {
    throw new Error("아직 AI 연동이 설정되지 않았습니다. AI 테스트 모드를 켜서 미리보기하거나, 관리자에게 Supabase Edge Function 설정을 요청해주세요.");
  }
  const response = await fetch(OPENAI_PROXY_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": OPENAI_PROXY_PUBLISHABLE_KEY,
      "Authorization": `Bearer ${OPENAI_PROXY_PUBLISHABLE_KEY}`,
    },
    body: JSON.stringify({ system, user }),
  });
  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error(`AI 서버 오류 (${response.status}) ${errText}`.trim());
  }
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  if (!data.text) throw new Error("AI 응답이 비어있습니다.");
  return data.text;
}

// 집중브리핑 초안 생성 - 교사가 "집중브리핑 초안 생성" 버튼을 눌렀을 때만 호출된다.
async function generateIntensiveBriefing(child, batch, references) {
  const text = await callAIModel(buildSystemPrompt(child), buildUserPrompt(child, batch, references));
  return parseSectionsJSON(text);
}

// 항목별 재생성 - 교사가 "이 항목만 재생성"을 눌렀을 때만, 해당 항목만 다시 생성한다.
async function regenerateBriefingSection(child, batch, sectionKey, currentSections, instruction, references) {
  const section = SECTION_DEFS.find(s => s.key === sectionKey);
  const text = await callAIModel(buildSectionSystemPrompt(section, child), buildSectionUserPrompt(child, batch, section, currentSections, instruction, references));
  return stripMetaPhrases(text.replace(/```/g, "").trim());
}

function mockGenerate(child, batch) {
  const topicList = batch.map(b => (b.topic || "").trim()).filter(Boolean);
  const cleanTopics = topicList.filter(t => /[가-힣a-zA-Z]{2,}/.test(t)); // 테스트용 낙서(ㅇㅁㅇㅁ 등) 걸러내기

  return {

function Badge({ children, color = "slate" }) {
  const map = {
    slate: "bg-slate-100 text-slate-600", gray: "bg-slate-200 text-slate-600",
    amber: "bg-amber-100 text-amber-700", blue: "bg-blue-100 text-blue-800",
    purple: "bg-purple-100 text-purple-700", green: "bg-emerald-100 text-emerald-700",
    red: "bg-red-100 text-red-600", navy: "bg-blue-900 text-white",
  };
  return <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${map[color]}`}>{children}</span>;
}

function Toast({ message, type }) {
  if (!message) return null;
  const color = type === "error" ? "bg-red-600" : "bg-blue-900";
  return (
    <div className={`fixed bottom-5 right-5 ${color} text-white px-4 py-3 rounded-lg shadow-lg text-sm z-50 flex items-center gap-2 max-w-xs`}>
      {type === "error" ? <AlertCircle className="w-4 h-4 shrink-0" /> : <CheckCircle2 className="w-4 h-4 shrink-0" />}
      {message}
    </div>
  );
}

function AutoTextarea({ value, onChange, placeholder, disabled, minRows = 2, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) { ref.current.style.height = "auto"; ref.current.style.height = ref.current.scrollHeight + "px"; }
  }, [value]);
  return (
    <textarea
      ref={ref} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled}
      rows={minRows}
      className={`w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 disabled:bg-slate-50 disabled:text-slate-600 resize-none overflow-hidden ${className}`}
    />
  );
}

function statusOf(child, briefings, deepBriefings) {
  const cb = briefings.filter(b => b.childId === child.id && b.status === "completed");
  const db = deepBriefings.filter(d => d.childId === child.id);
  const finalized = db.filter(d => d.status === "final").length;
  const reviewing = db.some(d => d.status === "reviewing" || d.status === "draft");
  const used = db.length * 4;
  const pending = cb.length - used;
  if (reviewing) {
    const draft = db.find(d => d.status === "draft" || d.status === "reviewing");
    if (draft.status === "draft") return { label: "초안 생성", color: "blue" };
    return { label: "검토 중", color: "purple" };
  }
  if (pending >= 4) return { label: "4회 누적 완료", color: "amber" };
  if (finalized > 0) return { label: "최종 확정", color: "green" };
  return { label: "기록 부족", color: "gray" };
}

    ...(role === "admin" ? [{ key: "accounts", label: "계정 관리", icon: ShieldCheck }] : []),
  ];
  const scheduleActive = view === "schedule";
  // 사이드바 표시 여부/위치는 Tailwind의 md: 같은 CSS 미디어쿼리 브레이크포인트에 기대지 않고
  // JS로 계산한 isMobile 값과 인라인 스타일로 직접 제어합니다.
  // (게시된 아티팩트 환경에서는 미리보기와 뷰포트 계산 방식이 달라 반응형 클래스가
  // 의도대로 동작하지 않는 경우가 있어, 구조에 영향을 주는 값은 인라인 스타일로 고정합니다.)
  const sidebarStyle = isMobile
    ? {
        width: 240, flexShrink: 0, position: "fixed", top: 0, bottom: 0, left: 0, zIndex: 30,
        transform: mobileOpen ? "translateX(0)" : "translateX(-100%)", transition: "transform 0.2s ease",
      }
    : { width: 240, flexShrink: 0, position: "relative" };
  return (
    <div style={sidebarStyle} className="bg-blue-900 text-white flex flex-col h-full print:hidden">
      <div className="px-5 py-6 border-b border-blue-800/60 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-lg bg-amber-400 flex items-center justify-center">
            <GraduationCap className="w-5 h-5 text-blue-900" />
          </div>
          <div>
            <div className="font-bold leading-tight text-[15px]">자라다남아미술학원</div>
            <div className="text-[11px] text-blue-200">수업 기록 · 심화브리핑</div>
          </div>
        </div>
        {isMobile && <button className="text-blue-200" onClick={() => setMobileOpen(false)}><X className="w-5 h-5" /></button>}
      </div>
      <nav className="flex-1 px-3 py-4 space-y-1">
        <button
          onClick={() => { setView("dashboard"); setMobileOpen(false); }}
          className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
            view === "dashboard" ? "bg-amber-400 text-blue-900" : "text-blue-100 hover:bg-blue-800/60"
          }`}
        >
          <LayoutDashboard className="w-4 h-4" /> 대시보드
        </button>

        <div>
          <button
            onClick={() => { setView("schedule"); onSelectClass(null); setMobileOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
              scheduleActive ? "bg-amber-400 text-blue-900" : "text-blue-100 hover:bg-blue-800/60"
            }`}
          >
            <ClipboardList className="w-4 h-4" /> 수업 기록
          </button>
          {scheduleActive && classNames.length > 0 && (
            <div className="pl-8 py-1 space-y-0.5">
              <button
                onClick={() => onSelectClass(null)}
                className={`w-full text-left px-2 py-1 rounded-md text-xs transition-colors ${!classFilter ? "text-amber-300 font-semibold" : "text-blue-200 hover:text-white"}`}
              >
                전체 보기
              </button>
              {classNames.map(cn => (
                <button
                  key={cn}
                  onClick={() => onSelectClass(cn)}
                  className={`w-full text-left px-2 py-1 rounded-md text-xs transition-colors ${classFilter === cn ? "text-amber-300 font-semibold" : "text-blue-200 hover:text-white"}`}
                >
                  {cn}
                </button>
              ))}
            </div>
          )}
        </div>

        <div>
          <button
            onClick={() => { setView("deepList"); setMobileOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
              view === "deepList" ? "bg-amber-400 text-blue-900" : "text-blue-100 hover:bg-blue-800/60"
            }`}
          >
            <FolderOpen className="w-4 h-4" /> 집중브리핑 모아보기
          </button>
        </div>

        <div>
          <button
            onClick={() => { setView("monthlyStars"); setMobileOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
              view === "monthlyStars" ? "bg-amber-400 text-blue-900" : "text-blue-100 hover:bg-blue-800/60"
            }`}
          >
            <Star className="w-4 h-4" /> 월간 자라다
          </button>
          {view === "monthlyStars" && classNames.length > 0 && (
            <div className="pl-8 py-1 space-y-0.5">
              <button
                onClick={() => { onSelectMonthlyStarClass(null); setMobileOpen(false); }}
                className={`w-full text-left px-2 py-1 rounded-md text-xs transition-colors ${!monthlyStarClass ? "text-amber-300 font-semibold" : "text-blue-200 hover:text-white"}`}
              >
                전체 보기
              </button>
              {classNames.map(cn => (
                <button
                  key={cn}
                  onClick={() => { onSelectMonthlyStarClass(cn); setMobileOpen(false); }}
                  className={`w-full text-left px-2 py-1 rounded-md text-xs transition-colors ${monthlyStarClass === cn ? "text-amber-300 font-semibold" : "text-blue-200 hover:text-white"}`}
                >
                  {cn}
                </button>
              ))}
            </div>
          )}
        </div>

        {nav.filter(n => n.key !== "dashboard").map(n => (
          <button
            key={n.key}
            onClick={() => { setView(n.key); setMobileOpen(false); }}
            className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
              view === n.key ? "bg-amber-400 text-blue-900" : "text-blue-100 hover:bg-blue-800/60"
            }`}
          >
            <n.icon className="w-4 h-4" />
            {n.label}
          </button>
        ))}
      </nav>
      <div className="px-4 py-4 border-t border-blue-800/60 space-y-3">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-full bg-blue-800 flex items-center justify-center font-bold text-sm shrink-0">{account?.name?.[0]}</div>
          <div className="min-w-0">
            <div className="text-sm font-semibold truncate">{account?.name} <span className="text-blue-300 font-normal">· {account?.classOrTitle}</span></div>
            <div className="text-[11px] text-blue-300">{role === "admin" ? "관리자" : "교사"}{account?.isSuperAdmin ? " · 최고 관리자" : ""}</div>
          </div>
        </div>
        <button onClick={onRefresh} className="w-full flex items-center justify-center gap-1.5 text-[11px] font-medium text-blue-100 bg-blue-800/60 rounded-lg py-1.5 hover:bg-blue-800">
          <RefreshCw className="w-3 h-3" /> 최신 데이터로 새로고침
        </button>
        <div className="flex gap-2">
          <button onClick={onOpenChangePassword} className="flex-1 text-[11px] font-medium text-blue-100 bg-blue-800/60 rounded-lg py-1.5 hover:bg-blue-800">비밀번호 변경</button>
          <button onClick={onLogout} className="flex-1 text-[11px] font-medium text-blue-100 bg-blue-800/60 rounded-lg py-1.5 hover:bg-blue-800">로그아웃</button>
        </div>
        <label className="flex items-center justify-between text-[11px] text-blue-200 pt-1">
          <span className="flex items-center gap-1"><Sparkles className="w-3 h-3" /> AI 테스트 모드</span>
          <input type="checkbox" checked={testMode} onChange={e => setTestMode(e.target.checked)} />
        </label>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   대시보드
--------------------------------------------------------- */
function Dashboard({ children, briefings, deepBriefings, schedule, attendance, draftIndex, teachers, role, teacherName, setTeacherName, teacherList, setSelectedChildId, setSelectedDeepId, setView, goToScheduleTarget }) {
  const [viewMode, setViewMode] = useState("day"); // day | week | month
  const [cursorDate, setCursorDate] = useState(todayISO());
  const [selectedTeacher, setSelectedTeacher] = useState("전체");
  const [showEmptySlots, setShowEmptySlots] = useState(false);
  const [expandedSlots, setExpandedSlots] = useState(() => new Set());
  const [rosterFilter, setRosterFilter] = useState(null); // 'done' | 'missing' | 'absent'
  const [tableFilter, setTableFilter] = useState(null);
  const tableRef = useRef(null);

  const scopeTeacher = selectedTeacher;
  const today = todayISO();
  const isToday = cursorDate === today;
  const cursorDay = dayFromDate(cursorDate);

  const activeChildren = children.filter(c => c.status !== "withdrawn");
  const childById = Object.fromEntries(activeChildren.map(c => [c.id, c]));
  const childByIdAll = Object.fromEntries(children.map(c => [c.id, c]));
  const scopedChildren = scopeTeacher === "전체" ? activeChildren : activeChildren.filter(c => c.teacher === scopeTeacher);

  const completedOn = (childId, date) => briefings.some(b => b.childId === childId && b.date === date && b.status === "completed" && !b.isMakeup);
  const attendanceOn = (childId, date) => attendance.find(a => a.childId === childId && a.date === date);

  const daySlots = schedule
    .filter(s => s.day === cursorDay)
    .filter(s => scopeTeacher === "전체" || s.teacher === scopeTeacher)
    .filter(s => showEmptySlots || s.childIds.length > 0)
    .sort((a, b) => a.order - b.order);

  const slotInfos = daySlots.map(slot => {
    const kids = slot.childIds.map(cid => {
      const child = childByIdAll[cid];
      // 'completed' | 'draft'(임시저장) | 'absent' | 'cancelled'(휴강) | 'empty'(미작성)
      const raw = childStatus(cid, cursorDate, briefings, attendance, draftIndex || {});
      const status = raw === "empty" ? "missing" : raw;
      return { child, status };
    }).filter(k => k.child);
    const total = kids.length;
    const done = kids.filter(k => k.status === "completed").length;
    const absent = kids.filter(k => k.status === "absent" || k.status === "cancelled").length;
    const missing = total - done - absent;
    return { slot, kids, total, done, absent, missing };
  });

  const totalToday = slotInfos.reduce((s, x) => s + x.total, 0);
  const doneToday = slotInfos.reduce((s, x) => s + x.done, 0);
  const absentToday = slotInfos.reduce((s, x) => s + x.absent, 0);
  const missingToday = slotInfos.reduce((s, x) => s + x.missing, 0);
  const progressBase = totalToday - absentToday;
  const progressPct = progressBase > 0 ? Math.round((doneToday / progressBase) * 100) : 0;

  const deepStatusFor = (child) => {
    const cb = briefings.filter(b => b.childId === child.id && b.status === "completed").length;
    const myDeep = deepBriefings.filter(d => d.childId === child.id).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const used = myDeep.length * 4;
    const pending = cb - used;
    const active = myDeep.find(d => d.status === "draft" || d.status === "reviewing");
    if (active) return active.status;
    if (pending >= 4) return "ready";
    if (pending === 3) return "almost";
    return "accumulating";
  };

  const readyForDeep = scopedChildren.filter(c => deepStatusFor(c) === "ready");
  const almostChildren = scopedChildren.filter(c => deepStatusFor(c) === "almost");
  const reviewQueue = deepBriefings.filter(d => (d.status === "draft" || d.status === "reviewing") && (scopeTeacher === "전체" || childByIdAll[d.childId]?.teacher === scopeTeacher));

  // 지금 처리할 일 (오늘 보기에서만)
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const tasks = [];
  if (viewMode === "day") {
    slotInfos.forEach(({ slot, missing, total }) => {
      if (missing === 0) return;
      let urgent = false, sub = "예정", priority = 3;
      if (isToday) {
        const startMin = timeStrToMinutes(slot.startTime), endMin = timeStrToMinutes(slot.endTime);
        if (nowMinutes > endMin) { urgent = true; sub = "수업 종료 · 미작성"; priority = 1; }
        else if (nowMinutes >= startMin) { sub = "진행 중"; priority = 2; }
      }
      tasks.push({ key: `slot-${slot.id}`, urgent, priority, label: `${slot.day} ${slot.name} 미작성 ${missing}명`, sub, actionLabel: "기록하기", onClick: () => goToScheduleTarget(slot.day, slot.id) });
    });
    reviewQueue.forEach(d => {
      const c = childByIdAll[d.childId];
      tasks.push({ key: `review-${d.id}`, urgent: false, priority: 4, label: `${c?.name || "아이"} 심화브리핑 ${d.status === "draft" ? "검토 대기" : "관리자 검토 중"}`, sub: formatDate(d.updatedAt || d.createdAt), actionLabel: "검토하기", onClick: () => { setSelectedDeepId(d.id); setView("deepReview"); } });
    });
    readyForDeep.forEach(c => {
      tasks.push({ key: `ready-${c.id}`, urgent: false, priority: 5, label: `${c.name} 심화브리핑 생성 가능`, sub: "4/4회 누적", actionLabel: "초안 생성", onClick: () => { setSelectedChildId(c.id); setView("childDetail"); } });
    });
    almostChildren.forEach(c => {
      tasks.push({ key: `almost-${c.id}`, urgent: false, priority: 6, label: `${c.name} 일일 기록 1회 남음`, sub: "3/4회 누적", actionLabel: "기록 확인", onClick: () => { setSelectedChildId(c.id); setView("childDetail"); } });
    });
    tasks.sort((a, b) => a.priority - b.priority);
  }

  // 심화브리핑 진행 현황 표 대상: 진행 중인 아이만
  const progressRows = scopedChildren
    .map(c => {
      const cb = briefings.filter(b => b.childId === c.id && b.status === "completed").sort((a, b) => new Date(b.date) - new Date(a.date));
      if (cb.length === 0) return null;
      const myDeep = deepBriefings.filter(d => d.childId === c.id).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const used = myDeep.length * 4;
      const pending = cb.length - used;
      const active = myDeep.find(d => d.status === "draft" || d.status === "reviewing");
      let statusKey, statusLabel, statusColor, actionLabel, onAction;
      if (active) {
        statusKey = active.status;
        statusLabel = active.status === "draft" ? "검토 대기" : "관리자 검토 중";
        statusColor = "purple";
        actionLabel = "검토하기";
        onAction = () => { setSelectedDeepId(active.id); setView("deepReview"); };
      } else if (pending >= 4) {
        statusKey = "ready"; statusLabel = "생성 가능"; statusColor = "amber"; actionLabel = "초안 생성";
        onAction = () => { setSelectedChildId(c.id); setView("childDetail"); };
      } else if (myDeep[0]?.status === "final" && pending === 0) {
        statusKey = "final"; statusLabel = "최종 확정 완료"; statusColor = "green"; actionLabel = "확인하기";
        onAction = () => { setSelectedChildId(c.id); setView("childDetail"); };
      } else {
        statusKey = "accumulating"; statusLabel = pending === 3 ? "1회 남음" : "기록 누적 중"; statusColor = "blue"; actionLabel = "기록 확인";
        onAction = () => { setSelectedChildId(c.id); setView("childDetail"); };
      }
      const cycleCount = pending >= 4 ? 4 : Math.max(pending, 0);
      return { child: c, cycleCount, statusKey, statusLabel, statusColor, actionLabel, onAction, lastDate: cb[0].date };
    })
    .filter(Boolean)
    .filter(r => !tableFilter || (tableFilter === "review" ? (r.statusKey === "draft" || r.statusKey === "reviewing") : r.statusKey === tableFilter));

  // 이번 달 심화브리핑 완료율
  const monthPool = scopedChildren;
  const monthBuckets = { ready: 0, draft: 0, reviewing: 0, final: 0, none: 0 };
  monthPool.forEach(c => {
    const myDeep = deepBriefings.filter(d => d.childId === c.id);
    const finalThisMonth = myDeep.find(d => d.status === "final" && d.finalizedAt && isSameMonth(d.finalizedAt));
    const active = myDeep.find(d => d.status === "draft" || d.status === "reviewing");
    if (finalThisMonth) monthBuckets.final++;
    else if (active?.status === "reviewing") monthBuckets.reviewing++;
    else if (active?.status === "draft") monthBuckets.draft++;
    else if (deepStatusFor(c) === "ready") monthBuckets.ready++;
    else monthBuckets.none++;
  });
  const monthTotal = monthPool.length;
  const monthRate = monthTotal ? Math.round((monthBuckets.final / monthTotal) * 100) : 0;

  const jumpToTable = (filterKey) => { setTableFilter(filterKey); tableRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }); };

  return (
    <div className="space-y-5">
      {/* 상단 날짜 영역 */}
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">대시보드</h1>
          <p className="text-sm text-slate-500 mt-0.5">{formatDate(cursorDate)} ({cursorDay}) {isToday && <span className="text-blue-900 font-medium">· 오늘</span>}</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          {viewMode === "day" && (
            <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-1 py-1">
              <button onClick={() => setCursorDate(addDays(cursorDate, -1))} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-500"><ArrowLeft className="w-3.5 h-3.5" /></button>
              <button onClick={() => setCursorDate(today)} className="px-2 py-1 text-xs font-medium text-blue-900 hover:bg-blue-50 rounded-md">오늘</button>
              <button onClick={() => setCursorDate(addDays(cursorDate, 1))} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-500"><ArrowRight className="w-3.5 h-3.5" /></button>
            </div>
          )}
          <div className="flex bg-white border border-slate-200 rounded-lg p-1 text-xs">
            {[["day", "오늘"], ["week", "주간"], ["month", "월간"]].map(([k, l]) => (
              <button key={k} onClick={() => setViewMode(k)} className={`px-3 py-1.5 rounded-md font-medium ${viewMode === k ? "bg-blue-900 text-white" : "text-slate-500 hover:bg-slate-50"}`}>{l}</button>
            ))}
          </div>
          <select value={selectedTeacher} onChange={e => setSelectedTeacher(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-1.5 text-xs bg-white">
            <option value="전체">전체 교사</option>
            {teacherList.map(t => <option key={t} value={t}>{t} 선생님</option>)}
          </select>
        </div>
      </div>

      {viewMode === "day" && (
        <>
          {/* 오늘 수업 기록 통합 카드 */}
          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <div className="flex items-center justify-between mb-2">
              <h2 className="font-semibold text-slate-800 text-sm">오늘 수업 기록</h2>
              <span className="text-sm text-slate-500">{doneToday}명 완료 / 전체 {totalToday}명 · {progressPct}%</span>
            </div>
            <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden mb-4">
              <div className="h-full bg-blue-900" style={{ width: `${progressPct}%` }} />
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setRosterFilter(rosterFilter === "done" ? null : "done")} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border ${rosterFilter === "done" ? "border-emerald-400 bg-emerald-50" : "border-slate-200 hover:bg-slate-50"}`}><CheckCircle2 className="w-3.5 h-3.5 text-emerald-600" /> 작성 완료 {doneToday}명</button>
              <button onClick={() => setRosterFilter(rosterFilter === "missing" ? null : "missing")} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border ${rosterFilter === "missing" ? "border-red-400 bg-red-50" : "border-slate-200 hover:bg-slate-50"}`}><span className="w-2 h-2 rounded-full bg-red-500" /> 미작성 {missingToday}명</button>
              <button onClick={() => setRosterFilter(rosterFilter === "absent" ? null : "absent")} className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border ${rosterFilter === "absent" ? "border-slate-400 bg-slate-100" : "border-slate-200 hover:bg-slate-50"}`}><UserX className="w-3.5 h-3.5 text-slate-400" /> 결석 {absentToday}명</button>
              <button onClick={() => jumpToTable("ready")} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-amber-50"><Sparkles className="w-3.5 h-3.5 text-amber-500" /> 심화브리핑 생성 가능 {readyForDeep.length}명</button>
              <button onClick={() => jumpToTable("review")} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-purple-50"><ListChecks className="w-3.5 h-3.5 text-purple-500" /> 심화브리핑 검토 대기 {reviewQueue.length}건</button>
            </div>
          </div>

          {/* 오늘 수업 시간표 + 지금 처리할 일 */}
          <div className="grid lg:grid-cols-10 gap-4 items-start">
            <div className="lg:col-span-7 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="font-semibold text-slate-800 text-sm">오늘 수업 시간표</h2>
                <label className="flex items-center gap-1.5 text-[11px] text-slate-400">
                  <input type="checkbox" checked={showEmptySlots} onChange={e => setShowEmptySlots(e.target.checked)} /> 빈 교시 포함
                </label>
              </div>
              {slotInfos.length === 0 && <div className="bg-white rounded-xl border border-slate-200 border-dashed p-8 text-center text-sm text-slate-400">해당 조건의 교시가 없습니다.</div>}
              {slotInfos.map(({ slot, kids, total, done, missing }) => {
                const open = expandedSlots.has(slot.id);
                const firstIncomplete = kids.find(k => k.status !== "completed" && k.status !== "absent" && k.status !== "cancelled");
                const visibleKids = rosterFilter ? kids.filter(k => (rosterFilter === "missing" ? (k.status === "missing" || k.status === "draft") : rosterFilter === "absent" ? (k.status === "absent" || k.status === "cancelled") : k.status === rosterFilter)) : kids;
                return (
                  <div key={slot.id} className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                    <button onClick={() => setExpandedSlots(prev => { const n = new Set(prev); n.has(slot.id) ? n.delete(slot.id) : n.add(slot.id); return n; })} className="w-full flex items-center justify-between px-4 py-3 hover:bg-slate-50">
                      <div className="text-left">
                        <div className="text-sm font-semibold text-slate-800">{slot.day}요일 {slot.name}</div>
                        <div className="text-xs text-slate-400 mt-0.5">{slot.startTime}~{slot.endTime} · {slot.teacher} 선생님</div>
                      </div>
                      <div className="flex items-center gap-3">
                        <div className="text-right">
                          <div className="text-xs font-medium text-slate-600">{done}/{total}명 작성 완료</div>
                          {missing > 0 && <div className="text-[11px] text-red-500">{missing}명 미작성</div>}
                        </div>
                        <ChevronDown className={`w-4 h-4 text-slate-400 transition-transform ${open ? "rotate-180" : ""}`} />

                    </button>
                    <div className="px-4 pb-3 flex items-center gap-2">
                      <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-blue-900" style={{ width: total ? `${(done / total) * 100}%` : "0%" }} /></div>
                      {missing > 0 && firstIncomplete && (
                        <button onClick={() => goToScheduleTarget(slot.day, slot.id)} className="shrink-0 text-[11px] font-medium text-blue-900 border border-blue-200 rounded-md px-2.5 py-1 hover:bg-blue-50">이어서 작성</button>
                      )}

                    {open && (
                      <div className="border-t border-slate-100">
                        {visibleKids.length === 0 && <p className="text-xs text-slate-300 px-4 py-3">표시할 아이가 없습니다.</p>}
                        {visibleKids.map(({ child, status }) => (

                            <span className="text-slate-700">{child.name} <span className="text-slate-400">{child.age}</span></span>
                            {status === "completed" && <span className="flex items-center gap-1 text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full"><CheckCircle2 className="w-3 h-3" /> 작성 완료</span>}
                            {status === "draft" && <span className="flex items-center gap-1 text-[11px] text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full"><FileText className="w-3 h-3" /> 임시저장</span>}
                            {status === "missing" && <span className="flex items-center gap-1 text-[11px] text-red-600"><span className="w-1.5 h-1.5 rounded-full bg-red-500" /> 미작성</span>}
                            {(status === "absent" || status === "cancelled") && <span className="text-[11px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{status === "absent" ? "결석" : "휴강"}</span>}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="lg:col-span-3 space-y-2">
              <h2 className="font-semibold text-slate-800 text-sm">지금 처리할 일</h2>
              {tasks.length === 0 && <div className="bg-white rounded-xl border border-slate-200 p-4 text-sm text-slate-400">처리할 일이 없습니다.</div>}
              {tasks.slice(0, 10).map(t => (
                <div key={t.key} className={`bg-white rounded-xl border p-3 flex items-center justify-between gap-2 ${t.urgent ? "border-red-200" : "border-slate-200"}`}>

                    <div className="text-[11px] text-slate-400 mt-0.5">{t.sub}</div>

                  <button onClick={t.onClick} className={`shrink-0 text-[11px] font-medium px-2.5 py-1.5 rounded-lg ${t.urgent ? "bg-red-600 text-white" : "bg-blue-900 text-white"}`}>{t.actionLabel}</button>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {viewMode === "week" && <DashboardWeekView schedule={schedule} briefings={briefings} attendance={attendance} childByIdAll={childByIdAll} scopeTeacher={scopeTeacher} cursorDate={cursorDate} readyForDeep={readyForDeep} setSelectedChildId={setSelectedChildId} setView={setView} />}
      {viewMode === "month" && <DashboardMonthView schedule={schedule} briefings={briefings} deepBriefings={deepBriefings} attendance={attendance} scopedChildren={scopedChildren} cursorDate={cursorDate} teacherList={teacherList} />}

            <div className="sm:hidden space-y-2">
              {progressRows.map(r => (
                <div key={r.child.id} className="border border-slate-100 rounded-lg p-3">
                  <div className="flex items-center justify-between mb-1">

          <p className="text-sm text-slate-400">이번 달 심화브리핑 대상이 없습니다.</p>
        ) : (
          <>
            <div className="flex items-center gap-3 mb-2">
              <span className="text-sm text-slate-600">{monthBuckets.final}/{monthTotal}명 완료 · {monthRate}%</span>
            </div>

              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-amber-400" /> 생성 가능 {monthBuckets.ready}</span>
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-blue-400" /> 초안 작성 {monthBuckets.draft}</span>

function DashboardWeekView({ schedule, briefings, attendance, childByIdAll, scopeTeacher, cursorDate, readyForDeep, setSelectedChildId, setView }) {
  const weekDates = datesOfWeek(cursorDate);
  const isAbsent = (cid, date) => attendance.some(a => a.childId === cid && a.date === date);
  const completedOn = (cid, date) => briefings.some(b => b.childId === cid && b.date === date && b.status === "completed" && !b.isMakeup);

  const byDay = weekDates.map(date => {
    const day = dayFromDate(date);
    const slots = schedule.filter(s => s.day === day).filter(s => scopeTeacher === "전체" || s.teacher === scopeTeacher);
    let total = 0, done = 0;
    slots.forEach(s => { const relevant = s.childIds.filter(cid => !isAbsent(cid, date)); total += relevant.length; done += relevant.filter(cid => completedOn(cid, date)).length; });
    return { date, day, total, done };
  });

  const slotMissing = {};
  weekDates.forEach(date => {
    const day = dayFromDate(date);
    schedule.filter(s => s.day === day).filter(s => scopeTeacher === "전체" || s.teacher === scopeTeacher).forEach(s => {
      const relevant = s.childIds.filter(cid => !isAbsent(cid, date));
      const missing = relevant.filter(cid => !completedOn(cid, date)).length;
      if (missing > 0) { const key = `${s.day} ${s.name}`; slotMissing[key] = (slotMissing[key] || 0) + missing; }
    });
  });

  const teacherStats = {};
  weekDates.forEach(date => {
    const day = dayFromDate(date);
    schedule.filter(s => s.day === day).forEach(s => {
      teacherStats[s.teacher] = teacherStats[s.teacher] || { total: 0, done: 0 };
      const relevant = s.childIds.filter(cid => !isAbsent(cid, date));
      teacherStats[s.teacher].total += relevant.length;
      teacherStats[s.teacher].done += relevant.filter(cid => completedOn(cid, date)).length;
    });
  });

  const weekAttendance = attendance.filter(a => weekDates.includes(a.date));
  const absentCount = weekAttendance.filter(a => a.type === "absent").length;
  const cancelledCount = weekAttendance.filter(a => a.type === "cancelled").length;

  return (
    <div className="grid md:grid-cols-2 gap-4">
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">요일별 수업 인원 · 작성 완료</h2>
        <ul className="space-y-2">
          {byDay.map(d => (
            <li key={d.date} className="flex items-center gap-3 text-sm">
              <span className="w-16 text-slate-600 shrink-0">{d.day} {d.date.slice(5)}</span>
              <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-blue-900" style={{ width: d.total ? `${(d.done / d.total) * 100}%` : "0%" }} /></div>
              <span className="text-xs text-slate-400 w-14 text-right">{d.done}/{d.total}명</span>
            </li>
          ))}
        </ul>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">교시별 미작성 현황</h2>
        {Object.keys(slotMissing).length === 0 ? <p className="text-sm text-slate-400">이번 주 미작성이 없습니다.</p> : (
          <ul className="space-y-1.5">
            {Object.entries(slotMissing).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
              <li key={k} className="flex items-center justify-between text-sm"><span className="text-slate-600">{k}</span><Badge color="red">{v}명 미작성</Badge></li>
            ))}
          </ul>
        )}
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">교사별 작성률</h2>
        <ul className="space-y-2">
          {Object.entries(teacherStats).map(([t, s]) => (
            <li key={t} className="flex items-center gap-3 text-sm">
              <span className="w-20 text-slate-600 shrink-0 truncate">{t} 쌤</span>
              <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-blue-900" style={{ width: s.total ? `${(s.done / s.total) * 100}%` : "0%" }} /></div>
              <span className="text-xs text-slate-400 w-10 text-right">{s.done}/{s.total}</span>
            </li>
          ))}
        </ul>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
        <div>
          <h2 className="font-semibold text-slate-800 text-sm mb-2">이번 주 결석 · 휴강</h2>
          <div className="flex gap-4 text-sm text-slate-600"><span>결석 {absentCount}건</span><span>휴강 {cancelledCount}건</span></div>
        </div>
        <div>
          <h2 className="font-semibold text-slate-800 text-sm mb-2">심화브리핑 생성 가능 아이</h2>
          {readyForDeep.length === 0 ? <p className="text-sm text-slate-400">현재 없습니다.</p> : (
            <div className="flex flex-wrap gap-1.5">
              {readyForDeep.map(c => <button key={c.id} onClick={() => { setSelectedChildId(c.id); setView("childDetail"); }} className="text-xs bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full hover:bg-amber-100">{c.name}</button>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function DashboardMonthView({ schedule, briefings, deepBriefings, attendance, scopedChildren, cursorDate, teacherList }) {
  const monthDates = datesOfMonth(cursorDate);
  const isAbsent = (cid, date) => attendance.some(a => a.childId === cid && a.date === date);
  const completedOn = (cid, date) => briefings.some(b => b.childId === cid && b.date === date && b.status === "completed" && !b.isMakeup);

  const teacherStats = {};
  monthDates.forEach(date => {
    const day = dayFromDate(date);
    schedule.filter(s => s.day === day).forEach(s => {
      teacherStats[s.teacher] = teacherStats[s.teacher] || { total: 0, done: 0 };
      const relevant = s.childIds.filter(cid => !isAbsent(cid, date));
      teacherStats[s.teacher].total += relevant.length;
      teacherStats[s.teacher].done += relevant.filter(cid => completedOn(cid, date)).length;
    });
  });

  const childCounts = scopedChildren.map(c => ({ child: c, count: briefings.filter(b => b.childId === c.id && b.status === "completed" && isSameMonth(b.date, new Date(cursorDate))).length })).sort((a, b) => b.count - a.count);

  const finalizedThisMonth = deepBriefings.filter(d => d.status === "final" && d.finalizedAt && isSameMonth(d.finalizedAt, new Date(cursorDate)));
  const reviewQueueCount = deepBriefings.filter(d => d.status === "draft" || d.status === "reviewing").length;
  const monthTotal = scopedChildren.length;
  const monthFinal = finalizedThisMonth.length;
  const monthRate = monthTotal ? Math.round((monthFinal / monthTotal) * 100) : 0;

  const slotMissing = {};
  monthDates.forEach(date => {
    const day = dayFromDate(date);
    schedule.filter(s => s.day === day).forEach(s => {
      const relevant = s.childIds.filter(cid => !isAbsent(cid, date));
      const missing = relevant.filter(cid => !completedOn(cid, date)).length;
      if (missing > 0) { const key = `${s.day} ${s.name}`; slotMissing[key] = (slotMissing[key] || 0) + missing; }
    });
  });
  const repeatedMissing = Object.entries(slotMissing).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return (
    <div className="grid md:grid-cols-2 gap-4">
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">교사별 일일 브리핑 작성률 (이번 달)</h2>
        <ul className="space-y-2">
          {Object.entries(teacherStats).map(([t, s]) => (
            <li key={t} className="flex items-center gap-3 text-sm">
              <span className="w-20 text-slate-600 shrink-0 truncate">{t} 쌤</span>
              <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-blue-900" style={{ width: s.total ? `${(s.done / s.total) * 100}%` : "0%" }} /></div>
              <span className="text-xs text-slate-400 w-10 text-right">{s.done}/{s.total}</span>
            </li>
          ))}
        </ul>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">아이별 기록 누적 현황 (이번 달)</h2>
        <ul className="space-y-1.5 max-h-56 overflow-y-auto">
          {childCounts.map(({ child, count }) => (
            <li key={child.id} className="flex items-center justify-between text-sm"><span className="text-slate-600">{child.name}</span><span className="text-slate-400">{count}회</span></li>
          ))}
        </ul>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
        <h2 className="font-semibold text-slate-800 text-sm">심화브리핑 완료율 (이번 달)</h2>
        <div className="flex items-center gap-3">
          <div className="text-2xl font-bold text-blue-900">{monthRate}%</div>
          <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-amber-400" style={{ width: `${monthRate}%` }} /></div>
        </div>
        <div className="text-xs text-slate-500">검토 대기 {reviewQueueCount}건 · 기간 내 최종 확정 {monthFinal}건</div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-800 text-sm mb-3">누락 기록이 반복된 교시</h2>
        {repeatedMissing.length === 0 ? <p className="text-sm text-slate-400">반복되는 누락이 없습니다.</p> : (
          <ul className="space-y-1.5">
            {repeatedMissing.map(([k, v]) => <li key={k} className="flex items-center justify-between text-sm"><span className="text-slate-600">{k}</span><Badge color="red">{v}회 미작성</Badge></li>)}
          </ul>
        )}
      </div>
    </div>
  );
}

function ChildForm({ initial, schedule = [], teachers = [], initialSlotIds = [], onCancel, onSave }) {
  const [form, setForm] = useState(initial || { name: "", age: "", grade: "", teacher: "", className: "", parentNeeds: "", classNotes: "" });
  const [slotIds, setSlotIds] = useState(initialSlotIds);
  const [pendingDay, setPendingDay] = useState(DAYS[0]);
  const [pendingSlotId, setPendingSlotId] = useState("");
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const selectTeacher = (name) => {
    const t = teachers.find(x => x.name === name);
    setForm(f => ({ ...f, teacher: name, className: t ? t.className : f.className }));
  };
  const hasUnknownTeacher = form.teacher && !teachers.some(t => t.name === form.teacher);

  const daySlotOptions = schedule.filter(s => s.day === pendingDay).sort((a, b) => a.order - b.order);
  useEffect(() => { setPendingSlotId(daySlotOptions[0]?.id || ""); }, [pendingDay, schedule.length]); // eslint-disable-line
  const slotById = Object.fromEntries(schedule.map(s => [s.id, s]));
  const addSlot = () => { if (pendingSlotId && !slotIds.includes(pendingSlotId)) setSlotIds(prev => [...prev, pendingSlotId]); };
  const removeSlot = (id) => setSlotIds(prev => prev.filter(x => x !== id));

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-40 p-4">
      <div className="bg-white rounded-xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between">
          <h3 className="font-bold text-slate-800">{initial ? "아이 정보 수정" : "아이 등록"}</h3>
          <button onClick={onCancel}><X className="w-5 h-5 text-slate-400" /></button>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><label className="text-xs text-slate-500">이름</label><input value={form.name} onChange={e => set("name", e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">나이</label><input value={form.age} onChange={e => set("age", e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">학년</label><input value={form.grade} onChange={e => set("grade", e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div>

function TeacherManager({ teachers, children, schedule, onAdd, onEdit, onDelete }) {
  const blank = { name: "", className: "" };
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (t) => { setForm({ name: t.name, className: t.className }); setEditingId(t.id); };
  const cancelEdit = () => { setForm(blank); setEditingId(null); };
  const submit = () => {
    if (!form.name || !form.className) return;
    if (editingId) onEdit({ id: editingId, ...form });
    else onAdd(form);
    cancelEdit();
  };

  const countFor = (name) => ({
    children: children.filter(c => c.teacher === name && c.status !== "withdrawn").length,
    slots: schedule.filter(s => s.teacher === name).length,
  });

  return (
    <div className="space-y-5">
      <h1 className="text-2xl font-bold text-slate-800">교사 관리</h1>
      <p className="text-sm text-slate-500">교사를 등록해두면 아이 등록 시 교사를 선택하는 것만으로 담당 반이 자동으로 입력됩니다.</p>

      <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
        <div className="grid sm:grid-cols-2 gap-3">
          <div><label className="text-xs text-slate-500">교사 이름</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="예) 김청명" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
          <div><label className="text-xs text-slate-500">담당 반</label><input value={form.className} onChange={e => setForm({ ...form, className: e.target.value })} placeholder="예) 1반" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        </div>
        <div className="flex justify-end gap-2">
          {editingId && <button onClick={cancelEdit} className="px-4 py-2 text-sm rounded-lg text-slate-500 hover:bg-slate-50">취소</button>}
          <button onClick={submit} disabled={!form.name || !form.className} className="flex items-center gap-1.5 bg-blue-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-800 disabled:opacity-40">
            {editingId ? <><Save className="w-4 h-4" /> 수정 저장</> : <><Plus className="w-4 h-4" /> 교사 등록</>}
          </button>
        </div>
      </div>

      <div className="space-y-2">
        {teachers.map(t => {
          const cnt = countFor(t.name);
          return (
            <div key={t.id} className="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between">
              <div>
                <div className="text-sm font-semibold text-slate-800">{t.name} <span className="text-slate-400 font-normal">· {t.className}</span></div>
                <div className="text-xs text-slate-400 mt-0.5">담당 아이 {cnt.children}명 · 배정된 교시 {cnt.slots}개</div>
              </div>
              <div className="flex gap-1">
                <button onClick={() => startEdit(t)} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>
                <button onClick={() => onDelete(t.id)} className="p-1.5 rounded-md hover:bg-red-50 text-red-400"><Trash2 className="w-3.5 h-3.5" /></button>
              </div>
            </div>
          );
        })}
        {teachers.length === 0 && <p className="text-sm text-slate-400 text-center py-10">등록된 교사가 없습니다.</p>}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   로그인 / 비밀번호 변경 / 계정 관리(최고 관리자 전용)
--------------------------------------------------------- */
function LoginScreen({ accounts, onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const doLogin = async () => {
    if (loading) return;
    setError(""); setLoading(true);
    try {
      const account = accounts.find(a => a.username === username.trim());
      if (!account) { setError("아이디 또는 비밀번호가 올바르지 않습니다."); return; }
      const hash = hashPassword(password, account.username);
      if (hash !== account.passwordHash) { setError("아이디 또는 비밀번호가 올바르지 않습니다."); return; }
      await onLogin(account);
    } catch (err) {
      setError(`로그인 중 오류가 발생했습니다: ${err?.message || err}`);
    } finally {
      setLoading(false);
    }
  };
  const onKeyDown = (e) => { if (e.key === "Enter") doLogin(); };

  return (
    <div className="h-screen w-full flex items-center justify-center bg-slate-50 px-4">
      <div className="w-full max-w-sm bg-white rounded-2xl border border-slate-200 p-8">
        <div className="flex flex-col items-center mb-6">
          <div className="w-12 h-12 rounded-xl bg-amber-400 flex items-center justify-center mb-3"><GraduationCap className="w-6 h-6 text-blue-900" /></div>
          <div className="font-bold text-lg text-slate-800">자라다남아미술학원</div>
          <div className="text-xs text-slate-400 mt-1">성북길음원 · 수업 기록 시스템</div>
        </div>
        <div className="space-y-3">
          <div>
            <label className="text-xs text-slate-500">아이디 (전화번호)</label>
            <input value={username} onChange={e => setUsername(e.target.value)} onKeyDown={onKeyDown} placeholder="예) 41226619" className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm mt-1" autoComplete="username" />
          </div>
          <div>
            <label className="text-xs text-slate-500">비밀번호</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={onKeyDown} className="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm mt-1" autoComplete="current-password" />
          </div>
          {error && <p className="text-xs text-red-500">{error}</p>}
          {accounts.length === 0 && <p className="text-xs text-amber-600">계정 정보를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.</p>}
          <button type="button" onClick={doLogin} disabled={loading || !username || !password} className="w-full bg-blue-900 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-blue-800 disabled:opacity-50 flex items-center justify-center gap-2">
            {loading ? <Loader2 className="w-4 h-4 animate-spin" /> : null} {loading ? "확인 중..." : "로그인"}
          </button>
        </div>
        <p className="text-[11px] text-slate-400 text-center mt-4">초기 비밀번호는 1234입니다. 로그인 후 변경해주세요.</p>
      </div>
    </div>
  );
}

function ChangePasswordModal({ account, onClose, onChange, notify }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true);
    const hash = await hashPassword(current, account.username);
    if (hash !== account.passwordHash) { notify("현재 비밀번호가 올바르지 않습니다.", "error"); setBusy(false); return; }
    if (next.length < 4) { notify("새 비밀번호는 4자 이상으로 설정해주세요.", "error"); setBusy(false); return; }
    if (next !== confirm) { notify("새 비밀번호가 일치하지 않습니다.", "error"); setBusy(false); return; }
    const newHash = await hashPassword(next, account.username);
    await onChange(newHash);
    setBusy(false);
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-40 p-4">
      <div className="bg-white rounded-xl w-full max-w-sm p-6 space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="font-bold text-slate-800">비밀번호 변경</h3>
          <button onClick={onClose}><X className="w-5 h-5 text-slate-400" /></button>
        </div>
        <div><label className="text-xs text-slate-500">현재 비밀번호</label><input type="password" value={current} onChange={e => setCurrent(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        <div><label className="text-xs text-slate-500">새 비밀번호</label><input type="password" value={next} onChange={e => setNext(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        <div><label className="text-xs text-slate-500">새 비밀번호 확인</label><input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1" /></div>
        <div className="flex justify-end gap-2 pt-1">
          <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-slate-500 hover:bg-slate-50">취소</button>
          <button onClick={submit} disabled={busy || !current || !next || !confirm} className="px-4 py-2 text-sm rounded-lg bg-blue-900 text-white font-medium hover:bg-blue-800 disabled:opacity-40">변경</button>
        </div>
      </div>
    </div>
  );
}

function AccountManager({ accounts, teachers, onCreate, onUpdate, onResetPassword }) {
  const blank = { name: "", classOrTitle: "", username: "", role: "teacher", linkedTeacherName: "" };
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);

  const startEdit = (a) => { setForm({ name: a.name, classOrTitle: a.classOrTitle, username: a.username, role: a.role, linkedTeacherName: a.linkedTeacherName || "" }); setEditingId(a.id); };
  const cancel = () => { setForm(blank); setEditingId(null); };
  const submit = async () => {
    if (!form.name || !form.username || !form.classOrTitle) return;
    if (editingId) await onUpdate({ id: editingId, ...form, linkedTeacherName: form.linkedTeacherName || null });
    else await onCreate({ ...form, linkedTeacherName: form.linkedTeacherName || null });

  return (
    <div className="space-y-5">
      <h1 className="text-2xl font-bold text-slate-800">계정 관리</h1>
