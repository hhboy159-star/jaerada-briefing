        ) : (
          <button onClick={startAdd} className="flex items-center gap-1.5 bg-amber-400 text-blue-900 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-amber-300"><Plus className="w-4 h-4" /> 교시 추가</button>
        )}

        <div className="space-y-3">
          {DAYS.map(day => {
            const slots = schedule.filter(s => s.day === day).sort((a, b) => a.order - b.order);
            if (slots.length === 0) return null;
            return (
              <div key={day}>
                <div className="text-xs font-semibold text-slate-400 mb-1.5">{day}요일</div>
                <div className="space-y-1.5">
                  {slots.map(s => (
                    <div key={s.id} className="flex items-center justify-between border border-slate-200 rounded-lg px-3 py-2 text-sm">
                      <div><span className="font-medium text-slate-700">{s.name}</span> <span className="text-xs text-slate-400">{s.startTime}-{s.endTime} · {s.teacher} 선생님 · {s.childIds.length}명</span></div>
                      <div className="flex gap-1">
                        <button onClick={() => startEdit(s)} className="p-1.5 rounded-md hover:bg-slate-50 text-slate-400"><Edit2 className="w-3.5 h-3.5" /></button>
                        <button onClick={() => remove(s.id)} className="p-1.5 rounded-md hover:bg-red-50 text-red-400"><Trash2 className="w-3.5 h-3.5" /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ScheduleView({ schedule, children, teachers, classFilter, briefings, attendance, draftIndex, deepBriefings, role, teacherName, testMode, references, onSubmitBriefing, onDeleteBriefing, onSaveDraftIndex, onMarkAbsent, onCancelSlot, onSaveSchedule, onSaveFocusedDeep, target, clearTarget, notify, isMobile, setSelectedDeepId, setView }) {
  const [date, setDate] = useState(todayISO());
  const [selected, setSelected] = useState(null); // {child, slot}
  const [showManager, setShowManager] = useState(false);
  const [mobileShowForm, setMobileShowForm] = useState(false);

  useEffect(() => {
    if (target) {
      const slot = schedule.find(s => s.id === target.slotId);
      if (slot && slot.childIds.length) {
        const cid = target.childId || slot.childIds.find(id => childStatus(id, date, briefings, attendance, draftIndex) !== "completed") || slot.childIds[0];
        const c = children.find(ch => ch.id === cid);
        if (c) { setSelected({ child: c, slot }); setMobileShowForm(true); }
      }
      clearTarget();
    }
    // eslint-disable-next-line
  }, [target]);

  const goToChild = (cid, slot) => { if (!cid) return; const c = children.find(ch => ch.id === cid); if (c) { setSelected({ child: c, slot }); setMobileShowForm(true); } };

  // 데스크톱: 실제 CSS Grid로 '수업 선택 320px + 작성 영역 나머지 전체'를 강제합니다.
  // (Tailwind 반응형 클래스 대신 JS로 계산한 isMobile과 인라인 style로 구조를 고정)
  const gridStyle = isMobile ? {} : { display: "grid", gridTemplateColumns: "320px minmax(0, 1fr)", gap: 16, alignItems: "start" };

  return (
    <div className="space-y-4 h-full">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">수업 기록</h1>
          {classFilter && <p className="text-xs text-blue-900 font-medium mt-0.5">{classFilter} 보는 중</p>}
        </div>
        <div className="flex items-center gap-2">
          <Calendar className="w-4 h-4 text-slate-400" />
          <input type="date" value={date} onChange={e => setDate(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm" />
        </div>
      </div>

      <div style={gridStyle} className={isMobile ? "flex flex-col gap-4" : ""}>
        <div style={isMobile ? {} : { minWidth: 0 }} className={isMobile && mobileShowForm ? "hidden" : "block"}>
          <ScheduleTree
            schedule={schedule} children={children} teachers={teachers} classFilter={classFilter} briefings={briefings} attendance={attendance} draftIndex={draftIndex}
            role={role} teacherName={teacherName} date={date}
            selectedChildId={selected?.child.id}
            onSelect={(c, slot) => { setSelected({ child: c, slot }); setMobileShowForm(true); }}
            target={null} onManage={() => setShowManager(true)}
          />
        </div>
        <div style={{ minWidth: 0 }} className={isMobile && !mobileShowForm ? "hidden" : "block"}>
          {selected ? (
            <DailyBriefingPanel
              child={selected.child} slot={selected.slot} date={date} setDate={setDate}
              briefings={briefings} references={references} deepBriefings={deepBriefings} testMode={testMode}
              allBriefingsForChild={briefings.filter(b => b.childId === selected.child.id)}
              onSubmit={onSubmitBriefing}
              onDelete={onDeleteBriefing}
              onSaveDraft={onSaveDraftIndex}
              onMarkAbsent={(cid, d, slot) => { onMarkAbsent(cid, d, slot); }}
              onCancelSlot={(slot) => onCancelSlot(slot, date)}
              onSaveFocusedDeep={onSaveFocusedDeep}
              goToChild={goToChild}
              notify={notify}
              onBack={() => setMobileShowForm(false)}
              isMobile={isMobile}
              setSelectedDeepId={setSelectedDeepId}
              setView={setView}
            />
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 border-dashed p-10 text-center text-sm text-slate-400">
              왼쪽에서 요일과 교시를 펼쳐 아이를 선택하면 일일 브리핑을 작성할 수 있습니다.
            </div>
          )}
        </div>
      </div>

      {showManager && <ScheduleManager schedule={schedule} children={children.filter(c => c.status !== "withdrawn")} teachers={teachers} onClose={() => setShowManager(false)} onSave={(next) => { onSaveSchedule(next); }} />}
    </div>
  );
}

  // (아이 상세페이지 / 수업 기록 화면 / 집중브리핑 모아보기 중 어디서 들어왔는지에 따라 다름)
  const prevViewRef = useRef("dashboard");
  useEffect(() => { if (view !== "deepReview") prevViewRef.current = view; }, [view]);
  const [monthlyStarClass, setMonthlyStarClass] = useState(null);
  const [monthlyStars, setMonthlyStars] = useState([]);
  const [role, setRole] = useState("teacher");
  const [teacherName, setTeacherName] = useState("");
  const [testMode, setTestModeState] = useState(true);
  const [testModeLoaded, setTestModeLoaded] = useState(false);
  const setTestMode = (value) => { setTestModeState(value); saveKey("ai_test_mode", value, false); };
  useEffect(() => {
    (async () => {
      const saved = await loadKey("ai_test_mode", null, false);
      if (saved !== null) setTestModeState(saved);
      setTestModeLoaded(true);
    })();
  }, []);
  const [generating, setGenerating] = useState(false);
  const [toast, setToast] = useState({ msg: "", type: "info" });
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  // 사이드바/레이아웃 분기는 CSS 미디어쿼리(Tailwind md:)가 아니라 JS로 직접 측정한
  // 뷰포트 너비로 판단합니다 — 게시 환경에서 반응형 브레이크포인트가 미리보기와
  // 다르게 평가되는 문제를 피하기 위한 조치입니다. 기준은 1024px입니다.
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.innerWidth < 1024 : false));
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 1024);
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const notify = (msg, type = "info") => { setToast({ msg, type }); setTimeout(() => setToast({ msg: "", type: "info" }), type === "error" ? 8000 : 3000); };

  // 공유 데이터(Supabase)를 다시 불러와 화면에 반영합니다.
  // isInitial=true일 때만 "최초 1회 시드/마이그레이션" 로직을 실행합니다.
  // 각 단계를 서로 분리해서, 한 단계가 실패해도 나머지(특히 로그인 계정)는
  // 절대 영향받지 않고 계속 동작하도록 만들었습니다.
  const loadAllData = async (isInitial) => {
    if (isInitial) setLoading(true);

    if (isInitial) {
      try {
        let tc0 = await loadKey("app_teachers", null);
        if (!tc0 || tc0.length === 0) { tc0 = buildSeedTeachers(); await saveKey("app_teachers", tc0); }

        // 명단은 "정말로 비어있을 때"만 채웁니다. 버전 값이 안 맞는다고
        // 이미 존재하는 아이/반/수업기록을 절대 덮어쓰지 않습니다.
        const existingChildren = await loadKey("app_children", []);
        const rosterVersion = await loadKey("app_roster_version", null);
        if ((!existingChildren || existingChildren.length === 0) && rosterVersion !== ROSTER_VERSION) {
          const real = buildRealRosterData(tc0);
          await saveKey("app_children", real.children);
          await saveKey("app_schedule", real.schedule);
          await saveKey("app_roster_version", ROSTER_VERSION);
        } else if (rosterVersion !== ROSTER_VERSION) {
          // 이미 데이터가 있는데 버전만 안 맞는 경우 — 데이터는 그대로 두고 버전 표시만 맞춰서
          // 다음부터 이 검사를 반복하지 않게 합니다.
          await saveKey("app_roster_version", ROSTER_VERSION);
        }

        const r0 = await loadKey("app_references", null);
        if (!r0 || r0.length === 0) { await saveKey("app_references", buildSeedReferences()); }
      } catch (e) {
        console.error("초기 명단/참고자료 준비 중 오류", e);
      }

      // 2026-09-11: 학원에서 새로 주신 전체 명단으로 업데이트 (병합 방식 - 기존 기록 보존, 1회만 실행)
      try {
        const updateVersion = await loadKey("app_roster_update_version", null);
        if (updateVersion !== ROSTER_UPDATE_VERSION) {
          const tcNow = await loadKey("app_teachers", []);
          const childrenNow = await loadKey("app_children", []);
          const scheduleNow = await loadKey("app_schedule", []);
          const updated = buildRosterUpdate_20260911(tcNow, childrenNow, scheduleNow);
          await saveKey("app_children", updated.children);
          await saveKey("app_schedule", updated.schedule);
          await saveKey("app_roster_update_version", ROSTER_UPDATE_VERSION);
        }
      } catch (e) {
        console.error("명단 업데이트 중 오류", e);
      }

      // 2026-10-01: 업로드해주신 참고자료(성향파악론/사회성 코칭)를 반영해 참고자료를 보강 (병합 방식 - 기존 항목 보존, 1회만 실행)
      try {
        const refsUpdateVersion = await loadKey("app_references_update_version", null);
        if (refsUpdateVersion !== REFERENCES_UPDATE_VERSION) {
          const refsNow = await loadKey("app_references", []);
          const updatedRefs = buildReferencesUpdate_20261001(refsNow);
          await saveKey("app_references", updatedRefs);
          await saveKey("app_references_update_version", REFERENCES_UPDATE_VERSION);
        }
      } catch (e) {
        console.error("참고자료 업데이트 중 오류", e);
      }

      // 2026-10-01: 2반 월간 자라다 과거 선정 내역을 1회성으로 채워 넣기 (중복 방지, 1회만 실행)
      try {
        const msSeedVersion = await loadKey("app_monthlystars_seed_version", null);
        if (msSeedVersion !== MONTHLY_STARS_SEED_VERSION) {
          const msNow = await loadKey("app_monthlystars", []);
          const updatedMs = buildMonthlyStarsSeed_2ban(msNow);
          await saveKey("app_monthlystars", updatedMs);
          await saveKey("app_monthlystars_seed_version", MONTHLY_STARS_SEED_VERSION);
        }
      } catch (e) {
        console.error("월간 자라다 시드 중 오류", e);
      }

      // 계정만 따로, 별도의 안전망으로 처리합니다 — 이 부분이 실패해도
      // 아래에서 항상 로그인 가능한 기본 계정 5개를 화면에 채워줍니다.
      // (이미 계정이 있는데 버전만 안 맞는 경우 데이터는 절대 덮어쓰지 않습니다)
      try {
        const accountsVersion = await loadKey("app_accounts_version", null);
        const existing = await loadKey("app_accounts", []);
        if (!existing || existing.length === 0) {
          const ac0 = await buildSeedAccounts();
          await saveKey("app_accounts", ac0);
          await saveKey("app_accounts_version", ACCOUNTS_VERSION);
        } else if (accountsVersion !== ACCOUNTS_VERSION) {
          await saveKey("app_accounts_version", ACCOUNTS_VERSION);
        }
      } catch (e) {
        console.error("계정 준비 중 오류", e);
      }
    }

    // 여기부터는 항상 "현재 저장된 값 읽기"만 합니다 (재시드 없음)
    // loadKeyStrict를 써서, 서버 오류가 나면 Promise.all이 실패로 넘어가
    // 아래 setXxx가 아예 실행되지 않고(=화면이 그대로 유지되고) catch로 갑니다.
    try {
      const [tc, c, sc, b, at, d, r, ac, di, ms] = await Promise.all([
        loadKeyStrict("app_teachers"),
        loadKeyStrict("app_children"),
        loadKeyStrict("app_schedule"),
        loadKeyStrict("app_briefings"),
        loadKeyStrict("app_attendance"),
        loadKeyStrict("app_deepbriefings"),
        loadKeyStrict("app_references"),
        loadKeyStrict("app_accounts"),
        loadKeyStrict("app_draftindex"),
        loadKeyStrict("app_monthlystars"),
      ]);

      setTeachers(tc ?? []); setChildren(c ?? []); setSchedule(sc ?? []); setBriefings(b ?? []); setAttendance(at ?? []);
      setDeepBriefings(d ?? []); setReferences(r ?? []); setDraftIndex(di ?? {}); setMonthlyStars(ms ?? []);

      // 계정 목록이 진짜로 비어있다면(방금 시드 저장이 안 됐거나 네트워크 문제) 화면이라도
      // 계정 목록을 못 가져왔을 때는(일시적 오류일 수 있음) 화면이라도 로그인 가능하도록
      // 기본 계정 5개를 "화면에만" 채웁니다. 실제 저장소는 여기서 절대 건드리지 않습니다 —
      // 일시적인 오류로 실제 계정 데이터를 덮어쓰는 일을 막기 위해서입니다.
      if (ac && ac.length > 0) {
        setAccounts(ac);
      } else if (isInitial) {
        const fallback = await buildSeedAccounts();
        setAccounts(fallback);
      }

      if (isInitial) {
        const savedSessionId = await loadKey("session_account_id", null, false);
        if (savedSessionId) {
          const acc = (ac && ac.length ? ac : []).find(a => a.id === savedSessionId);
          if (acc) { setSession(acc); setRole(acc.role); setTeacherName(acc.linkedTeacherName || acc.name); }
        }
      }
    } catch (e) {
      console.error("데이터 새로고침 중 오류", e);
      if (isInitial) {
        notify("데이터를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.", "error");
        // 그래도 로그인 화면 자체는 항상 뜨도록 기본 계정을 채워둡니다.
        const fallback = await buildSeedAccounts();
        setAccounts(fallback);
      }
      // 주기적 새로고침 중 오류는 조용히 넘어가고 화면은 그대로 유지합니다 (다음 주기에 다시 시도).
    }
    if (isInitial) setLoading(false);
  };

  useEffect(() => {
    loadAllData(true);
    // 다른 컴퓨터에서 저장한 내용을 이 화면에도 반영하기 위해 20초마다 자동으로 새로고침합니다.
    const interval = setInterval(() => loadAllData(false), 20000);
    return () => clearInterval(interval);
  }, []);

  const teacherList = Array.from(new Set([...teachers.map(t => t.name), ...schedule.map(s => s.teacher), ...children.map(c => c.teacher)].filter(Boolean)));
  const classNames = Array.from(new Set(teachers.map(t => t.className).filter(Boolean))).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));

  const updateAccounts = (next) => { setAccounts(next); saveKey("app_accounts", next); };

  const handleLogin = async (account) => {
    setSession(account);
    setRole(account.role);
    setTeacherName(account.linkedTeacherName || account.name);
    await saveKey("session_account_id", account.id, false);
    updateAccounts(accounts.map(a => a.id === account.id ? { ...a, lastLogin: new Date().toISOString() } : a));
  };
  const handleLogout = async () => {
    setSession(null);
    await deleteKey("session_account_id", false);
    setView("dashboard");
  };
  const addAccount = async (form) => {
    const passwordHash = await hashPassword("1234", form.username);
    const newAcc = { id: uid(), name: form.name, username: form.username, classOrTitle: form.classOrTitle, role: form.role, linkedTeacherName: form.linkedTeacherName, isSuperAdmin: false, passwordHash, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), lastLogin: null };
    updateAccounts([...accounts, newAcc]);
    notify("계정을 생성했습니다. 초기 비밀번호는 1234입니다.");
  };
  const editAccount = async (form) => {
    updateAccounts(accounts.map(a => a.id === form.id ? { ...a, name: form.name, classOrTitle: form.classOrTitle, role: form.role, linkedTeacherName: form.linkedTeacherName, updatedAt: new Date().toISOString() } : a));
    if (session?.id === form.id) { setSession(s => ({ ...s, ...form })); setRole(form.role); setTeacherName(form.linkedTeacherName || form.name); }
    notify("계정 정보를 수정했습니다.");
  };
  const resetAccountPassword = async (id) => {
    const acc = accounts.find(a => a.id === id);
    const passwordHash = await hashPassword("1234", acc.username);
    updateAccounts(accounts.map(a => a.id === id ? { ...a, passwordHash, updatedAt: new Date().toISOString() } : a));
    notify("비밀번호를 1234로 초기화했습니다.");
  };
  const changeOwnPassword = async (newHash) => {
    updateAccounts(accounts.map(a => a.id === session.id ? { ...a, passwordHash: newHash, updatedAt: new Date().toISOString() } : a));
    setSession(s => ({ ...s, passwordHash: newHash }));
    notify("비밀번호를 변경했습니다.");
  };

  const updateChildren = (next) => { setChildren(next); saveKey("app_children", next); };
  const updateSchedule = (next) => { setSchedule(next); saveKey("app_schedule", next); };
  const updateBriefings = (next) => { setBriefings(next); saveKey("app_briefings", next); };
  const updateAttendance = (next) => { setAttendance(next); saveKey("app_attendance", next); };
  const updateDeep = (next) => { setDeepBriefings(next); saveKey("app_deepbriefings", next); };
  const updateRefs = (next) => { setReferences(next); saveKey("app_references", next); };
  const updateDraftIndex = (next) => { setDraftIndex(next); saveKey("app_draftindex", next); };
  const updateMonthlyStars = (next) => { setMonthlyStars(next); saveKey("app_monthlystars", next); };
  const addMonthlyStar = (form) => {
    updateMonthlyStars([...monthlyStars, { id: uid(), ...form, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }]);
    notify("월간 자라다 기록을 등록했습니다.");
  };
  const editMonthlyStar = (form) => {
    updateMonthlyStars(monthlyStars.map(x => x.id === form.id ? { ...x, ...form, updatedAt: new Date().toISOString() } : x));
    notify("월간 자라다 기록을 수정했습니다.");
  };
  const deleteMonthlyStar = (id) => updateMonthlyStars(monthlyStars.filter(x => x.id !== id));
  const updateTeachers = (next) => { setTeachers(next); saveKey("app_teachers", next); };

  const addTeacher = (t) => updateTeachers([...teachers, { id: uid(), createdAt: new Date().toISOString(), ...t }]);
  const editTeacher = (t) => {
    const before = teachers.find(x => x.id === t.id);
    updateTeachers(teachers.map(x => x.id === t.id ? t : x));
    // 이름이나 반이 바뀌면 이미 배정된 아이·교시 표기도 함께 갱신
    if (before && (before.name !== t.name || before.className !== t.className)) {
      updateChildren(children.map(c => c.teacher === before.name ? { ...c, teacher: t.name, className: t.className } : c));
      updateSchedule(schedule.map(s => s.teacher === before.name ? { ...s, teacher: t.name } : s));
    }
  };
  const deleteTeacher = (id) => {
    const t = teachers.find(x => x.id === id);
    if (t && (children.some(c => c.teacher === t.name) || schedule.some(s => s.teacher === t.name))) {
      notify("이 교사가 배정된 아이 또는 교시가 있어 삭제할 수 없습니다. 먼저 배정을 변경해주세요.", "error");
      return;
    }
    updateTeachers(teachers.filter(x => x.id !== id));
  };

  const syncChildSlots = (childId, slotIds) => {
    updateSchedule(schedule.map(s => {
      const has = s.childIds.includes(childId);
      const should = slotIds.includes(s.id);
      if (has && !should) return { ...s, childIds: s.childIds.filter(id => id !== childId) };
      if (!has && should) return { ...s, childIds: [...s.childIds, childId] };
      return s;
    }));
  };

  const addChild = (form, slotIds = []) => {
    const newChild = { id: uid(), status: "active", withdrawnAt: null, createdAt: new Date().toISOString(), ...form };
    updateChildren([...children, newChild]);
    if (slotIds.length) syncChildSlots(newChild.id, slotIds);
  };
  const editChild = (child, slotIds) => {
    updateChildren(children.map(c => c.id === child.id ? child : c));
    if (slotIds) syncChildSlots(child.id, slotIds);
  };
  const withdrawChild = (id) => {
    updateChildren(children.map(c => c.id === id ? { ...c, status: "withdrawn", withdrawnAt: new Date().toISOString() } : c));
    syncChildSlots(id, []);
    notify("퇴원 처리되었습니다. 기존 기록은 보존됩니다.");
    setView("children");
  };
  const reinstateChild = (id) => {
    updateChildren(children.map(c => c.id === id ? { ...c, status: "active", withdrawnAt: null } : c));
    notify("복귀 처리되었습니다. 요일·교시는 아이 정보 수정에서 다시 배정해주세요.");
  };
  const hardDeleteChild = (id) => {
    updateChildren(children.filter(c => c.id !== id));
    updateBriefings(briefings.filter(b => b.childId !== id));
    updateDeep(deepBriefings.filter(d => d.childId !== id));
    updateSchedule(schedule.map(s => ({ ...s, childIds: s.childIds.filter(cid => cid !== id) })));
    notify("완전히 삭제되었습니다.");
  };

  const addBriefing = (b) => updateBriefings([...briefings, b]);
  const editBriefing = (b) => updateBriefings(briefings.map(x => x.id === b.id ? { ...b, updatedAt: new Date().toISOString() } : x));
  const deleteBriefing = (id) => updateBriefings(briefings.filter(b => b.id !== id));

  const upsertScheduleBriefing = (b) => {
    const exists = briefings.some(x => x.id === b.id);
    updateBriefings(exists ? briefings.map(x => x.id === b.id ? b : x) : [...briefings, b]);
  };
  const setDraftFlag = async (childId, date, has) => {
    const key = `${childId}|${date}`;
    const next = { ...draftIndex };
    if (has) next[key] = true; else delete next[key];
    updateDraftIndex(next);
  };
  const markAbsent = (childId, date, slot) => {
    updateAttendance([...attendance, { id: uid(), childId, date, day: slot.day, slotId: slot.id, type: "absent", createdAt: new Date().toISOString() }]);
    notify("결석 처리되었습니다.");
  };
  const cancelSlot = (slot, date) => {
    const events = slot.childIds.map(cid => ({ id: uid(), childId: cid, date, day: slot.day, slotId: slot.id, type: "cancelled", createdAt: new Date().toISOString() }));
    updateAttendance([...attendance, ...events]);
    notify("해당 교시를 휴강 처리했습니다.");
  };

  const addReference = (r) => updateRefs([...references, r]);
  const deleteReference = (id) => updateRefs(references.filter(r => r.id !== id));

  const selectedChild = children.find(c => c.id === selectedChildId);
  const selectedDeep = deepBriefings.find(d => d.id === selectedDeepId);

  const handleGenerateDeep = async () => {
    if (!selectedChild) return;
    const myBriefings = briefings.filter(b => b.childId === selectedChild.id && b.status === "completed").sort((a, b) => new Date(a.date) - new Date(b.date));
    const myDeep = deepBriefings.filter(d => d.childId === selectedChild.id);
    const usedIds = new Set(myDeep.flatMap(d => d.sourceBriefingIds));
    const available = myBriefings.filter(b => !usedIds.has(b.id));
    if (available.length < 4) return;
    const batch = available.slice(0, 4);

    setGenerating(true);
    try {
      let sections;
      if (testMode) sections = mockGenerate(selectedChild, batch);
      else sections = await generateIntensiveBriefing(selectedChild, batch, references);
      const newDeep = {
        id: uid(), childId: selectedChild.id, sourceBriefingIds: batch.map(b => b.id), status: "draft",
        sections, appliedReferences: references, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      };
      updateDeep([...deepBriefings, newDeep]);
      setSelectedDeepId(newDeep.id); setView("deepReview");
      notify("심화브리핑 초안이 생성되었습니다.");
    } catch (e) { console.error("집중브리핑 생성 실패:", e); notify("집중브리핑 생성에 실패했습니다. 잠시 후 다시 시도해주세요.", "error"); }
    setGenerating(false);
  };

  // 수업 기록 화면에서 교사가 직접 고른 기록으로 만드는 "집중브리핑" 저장
  // (자동 4회 누적 규칙과 별개로, 원하는 기록만 골라 바로 작성/저장할 수 있습니다)
  const saveFocusedDeepBriefing = (child, batch, sections) => {
    const newDeep = {
      id: uid(), childId: child.id, sourceBriefingIds: batch.map(b => b.id), status: "draft",
      sections, appliedReferences: references, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    };
    updateDeep([...deepBriefings, newDeep]);
    return newDeep;
  };

  if (loading) return <div className="h-screen w-full flex items-center justify-center bg-slate-50"><Loader2 className="w-6 h-6 animate-spin text-blue-900" /></div>;
  if (!session) return <LoginScreen accounts={accounts} onLogin={handleLogin} />;

  return (
    <div style={{ display: "flex", height: "100vh", width: "100%", overflow: "hidden" }} className="bg-slate-50 text-slate-800 font-sans">
      <style>{`
        @media print {
          @page { size: A4; margin: 12mm; }
          .print\\:hidden { display: none !important; }
          body { background: white; font-size: 10.5pt; }
          .print-area { max-width: none !important; padding: 0 !important; margin: 0 !important; }
        }
      `}</style>
      {isMobile && mobileNavOpen && <div className="fixed inset-0 bg-black/30 z-20" onClick={() => setMobileNavOpen(false)} />}
      <Sidebar
        view={view} setView={setView} role={role} account={session} onLogout={handleLogout} onOpenChangePassword={() => setShowChangePassword(true)}
        onRefresh={() => { loadAllData(false); notify("최신 데이터로 새로고침했습니다."); }}
        teacherList={teacherList}
        classNames={classNames} classFilter={classFilter} onSelectClass={setClassFilter}
        monthlyStarClass={monthlyStarClass} onSelectMonthlyStarClass={setMonthlyStarClass}
        testMode={testMode} setTestMode={setTestMode} mobileOpen={mobileNavOpen} setMobileOpen={setMobileNavOpen}
        isMobile={isMobile}
      />
      <div style={{ flex: "1 1 0%", minWidth: 0, height: "100%", display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {isMobile && (
          <div className="sticky top-0 bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 z-10 print:hidden shrink-0">
            <button onClick={() => setMobileNavOpen(true)}><Menu className="w-5 h-5 text-slate-600" /></button>
            <span className="font-bold text-blue-900 text-sm">자라다남아미술학원</span>
          </div>
        )}
        <div style={{ flex: "1 1 auto", overflowY: "auto" }}>
          <div style={{ maxWidth: view === "schedule" ? "none" : 1800, margin: "0 auto" }} className="px-4 md:px-8 py-6 md:py-8 print-area">
          {view === "dashboard" && (
            <Dashboard
              children={children} briefings={briefings} deepBriefings={deepBriefings} schedule={schedule} attendance={attendance} draftIndex={draftIndex} teachers={teachers}
              role={role} teacherName={teacherName} setTeacherName={setTeacherName} teacherList={teacherList}
              setSelectedChildId={setSelectedChildId} setSelectedDeepId={setSelectedDeepId} setView={setView}
              goToScheduleTarget={(day, slotId, childId) => { setScheduleTarget({ day, slotId, childId }); setView("schedule"); }}
            />
          )}
          {view === "schedule" && (
            <ScheduleView
              schedule={schedule} children={children} teachers={teachers} classFilter={classFilter} briefings={briefings} attendance={attendance} draftIndex={draftIndex} deepBriefings={deepBriefings}
              role={role} teacherName={teacherName} testMode={testMode} references={references}
              onSubmitBriefing={upsertScheduleBriefing}
              onDeleteBriefing={deleteBriefing}
              onSaveDraftIndex={setDraftFlag}
              onMarkAbsent={markAbsent}
              onCancelSlot={cancelSlot}
              onSaveSchedule={updateSchedule}
              onSaveFocusedDeep={saveFocusedDeepBriefing}
              target={scheduleTarget}
              clearTarget={() => setScheduleTarget(null)}
              notify={notify}
              isMobile={isMobile}
              setSelectedDeepId={setSelectedDeepId}
              setView={setView}
            />
          )}
          {view === "children" && (
            <ChildrenList children={children} schedule={schedule} teachers={teachers} briefings={briefings} deepBriefings={deepBriefings} role={role} teacherName={teacherName} setView={setView} setSelectedChildId={setSelectedChildId} onAddChild={addChild} />
          )}
          {view === "teachers" && (
            <TeacherManager teachers={teachers} children={children} schedule={schedule} onAdd={addTeacher} onEdit={editTeacher} onDelete={deleteTeacher} />
          )}
          {view === "withdrawn" && (
            <WithdrawnList children={children} briefings={briefings} setView={setView} setSelectedChildId={setSelectedChildId} onReinstate={reinstateChild} onHardDelete={hardDeleteChild} />
          )}
          {view === "childDetail" && selectedChild && (
            <ChildDetail
              child={selectedChild} schedule={schedule} teachers={teachers} briefings={briefings} deepBriefings={deepBriefings} role={role} generating={generating}
              onUpdateChild={editChild} onWithdrawChild={withdrawChild} onReinstateChild={reinstateChild}
              onAddBriefing={addBriefing} onUpdateBriefing={editBriefing} onDeleteBriefing={deleteBriefing}
              onGenerateDeep={handleGenerateDeep} setView={setView} setSelectedDeepId={setSelectedDeepId}
            />
          )}
          {view === "deepList" && (
            <DeepBriefingList
              deepBriefings={deepBriefings} children={children} teachers={teachers} role={role} teacherName={teacherName}
              setSelectedChildId={setSelectedChildId} setSelectedDeepId={setSelectedDeepId} setView={setView}
            />
          )}
          {view === "deepReview" && selectedDeep && (
            <DeepBriefingReview
              deep={selectedDeep} child={children.find(c => c.id === selectedDeep.childId)}
              allDeepForChild={deepBriefings.filter(d => d.childId === selectedDeep.childId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))}
              references={references} sourceBriefings={briefings.filter(b => selectedDeep.sourceBriefingIds.includes(b.id))}
              role={role} testMode={testMode}
              onUpdate={(d) => updateDeep(deepBriefings.map(x => x.id === d.id ? d : x))}
              setView={setView} returnView={prevViewRef.current} setSelectedDeepId={setSelectedDeepId} notify={notify}
            />
          )}
          {view === "monthlyStars" && (
            <MonthlyStarManager
              className={monthlyStarClass} classNames={classNames} children={children} teachers={teachers} monthlyStars={monthlyStars}
              onAdd={addMonthlyStar} onEdit={editMonthlyStar} onDelete={deleteMonthlyStar} notify={notify}
            />
          )}
          {view === "references" && <ReferencesPage references={references} onAdd={addReference} onDelete={deleteReference} />}
          {view === "accounts" && role === "admin" && (
            <AccountManager accounts={accounts} teachers={teachers} onCreate={addAccount} onUpdate={editAccount} onResetPassword={resetAccountPassword} />
          )}
          </div>
        </div>
      </div>
      {showChangePassword && (
        <ChangePasswordModal account={session} onClose={() => setShowChangePassword(false)} onChange={changeOwnPassword} notify={notify} />
      )}
      <Toast message={toast.msg} type={toast.type} />
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
<script>
  // Babel의 자동 <script type="text/babel"> 스캔 기능이 일부 버전/환경에서
  // "Cannot use import statement outside a module" 오류를 내는 경우가 있어,
  // 위 스크립트는 type="text/plain"으로 감춰두고 여기서 직접 변환·실행합니다.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic", pragma: "React.createElement", pragmaFrag: "React.Fragment" }]],
      sourceType: "script",
    }).code;
    var script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>
</body>
